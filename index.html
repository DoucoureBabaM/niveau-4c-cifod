  // Regroupe les morceaux colorés d’un verset en mots (les signes de pause restent avec le mot précédent).
  // ——— Le Qur’ân : exercice « Trouver la règle » sur les sourates lues en classe ———
  qzStart() {
    const lvl = this.S().level; const list = this.qClassList(lvl);
    const blank = { loading: true, qs: [], i: 0, picked: -1, score: 0, done: false, err: '' };
    this.setState({ qz: blank });
    if (this.S().screen !== 'quranQuiz') this.go('quranQuiz'); else this.top();
    this.qLoadIndex();
    if (!this._qs) this._qs = {};
    Promise.all(list.map((n) => this._qs[n] ? Promise.resolve(this._qs[n]) : this.qGet(n).then((d) => { this._qs[n] = this.qNoBasmala(n, d); return this._qs[n]; })))
      .then((ds) => { const qs = this.qzBuild(lvl, list, ds); this.setState({ qz: Object.assign({}, blank, { loading: false, qs, err: qs.length ? '' : 'Aucune question disponible pour ces sourates.' }) }); })
      .catch(() => this.setState({ qz: Object.assign({}, blank, { loading: false, err: 'Impossible de charger les sourates. Vérifie ta connexion, puis réessaie.' }) }));
  }

  // 10 questions : une partie de verset annotée, réparties entre les règles vues au niveau choisi.
  qzBuild(lvl, list, ds) {
    const base = ['g', 'ig', 'in', 'l', 'f', 'is', 'fs', 'q'];
    const pool = lvl === '4A' ? base : base.concat(['m2', 'mt', 'mf', 'm246', 'm6']);
    const fam = (c) => (c.charAt(0) === 'm' ? 'm' : 'n');
    const byCode = {};
    ds.forEach((d, k) => {
      ((d && d.v) || []).forEach((v, i) => {
        const ann = v[2] || [];
        ann.forEach((a) => {
          if (pool.indexOf(a[2]) < 0) return;
          // Une partie couverte par deux règles différentes serait ambiguë : on l’écarte.
          if (ann.some((o) => o !== a && o[2] !== a[2] && o[0] < a[1] && a[0] < o[1])) return;
          (byCode[a[2]] = byCode[a[2]] || []).push({ n: list[k], v: i + 1, t: v[0], a: a[0], b: a[1], c: a[2] });
        });
      });
    });
    const codes = this.shuffle(Object.keys(byCode)); const out = []; const used = {};
    for (let r = 0; out.length < 10 && r < 600 && codes.some((c) => byCode[c].length); r++) {
      const L = byCode[codes[r % codes.length]]; if (!L.length) continue;
      const x = L.splice(Math.floor(Math.random() * L.length), 1)[0];
      const key = x.n + ':' + x.v; if (used[key] && r < 300) continue;
      used[key] = 1; out.push(x);
    }
    return this.shuffle(out).map((x) => {
      const same = this.shuffle(pool.filter((c) => c !== x.c && fam(c) === fam(x.c)));
      const diff = this.shuffle(pool.filter((c) => fam(c) !== fam(x.c)));
      const d = same.slice(0, diff.length ? 2 : 3).concat(diff.slice(0, 1));
      return Object.assign(x, { opts: this.shuffle([x.c].concat(d.concat(same.slice(d.length)).slice(0, 3))) });
    });
  }

  qzPick(k) {
    const z = this.S().qz; if (!z || z.picked >= 0) return;
    const q = z.qs[z.i]; if (!q) return;
    this.setState({ qz: Object.assign({}, z, { picked: k, score: z.score + (q.opts[k] === q.c ? 1 : 0) }) });
    setTimeout(() => { try { const el = document.getElementById('qz-fb'); if (el) el.scrollIntoView({ block: 'nearest' }); } catch (x) {} }, 80);
  }

  qzNext() {
    const z = this.S().qz; if (!z) return;
    if (z.i + 1 >= z.qs.length) this.setState({ qz: Object.assign({}, z, { done: true }) });
    else this.setState({ qz: Object.assign({}, z, { i: z.i + 1, picked: -1 }) });
    this.top();
  }

  qBmDel(v) {

  // ——— Le Qur’ân : suivi de lecture (sourates lues ou apprises, versets lus aujourd’hui) ———
  qToday() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  qSuiviSave() {
    const s = this.S();
    try { window.localStorage.setItem('waqf-suivi', JSON.stringify({ lu: s.qLu || {}, ap: s.qAp || {}, goal: s.qGoal || 20, day: s.qDay || '', seen: s.qSeen || {} })); } catch (e) {}
  }

  qMarkRead(n, kind) {
    const s = this.S(); if (!n) return;
    const key = kind === 'ap' ? 'qAp' : 'qLu'; const o = Object.assign({}, s[key] || {});
    if (o[n]) delete o[n]; else o[n] = this.qToday();
    const up = {}; up[key] = o;
    // Une sourate apprise est aussi une sourate lue.
    if (kind === 'ap' && o[n] && !(s.qLu || {})[n]) { up.qLu = Object.assign({}, s.qLu || {}); up.qLu[n] = this.qToday(); }
    this.setState(up); this.qSuiviSave();
  }

  // Toutes les 2 secondes dans le lecteur : un verset visible deux fois de suite compte comme lu aujourd’hui.
  qSeenTick() {
    const s = this.S();
    if (s.screen !== 'quranRead' || !s.qSurah || document.hidden) { this._qVis = null; return; }
    const today = this.qToday(); const fresh = s.qDay !== today; const seen = fresh ? {} : (s.qSeen || {});
    const vis = {}; const H = window.innerHeight;
    try { document.querySelectorAll('#q-verses > li').forEach((li) => { const r = li.getBoundingClientRect(); if (r.height && ((r.top >= -4 && r.bottom <= H - 70) || (r.top <= H * 0.3 && r.bottom >= H * 0.7))) vis[li.id] = 1; }); } catch (e) {}
    const prev = this._qVis || {}; this._qVis = vis;
    const ns = Object.assign({}, seen); let add = 0;
    Object.keys(vis).forEach((id) => { if (prev[id]) { const k = s.qSurah + ':' + id.slice(2); if (!ns[k]) { ns[k] = 1; add++; } } });
    if (!add && !fresh) return;
    const g = s.qGoal || 20; const before = Object.keys(seen).length; const after = Object.keys(ns).length;
    this.setState({ qSeen: ns, qDay: today }); this.qSuiviSave();
    if (before < g && after >= g) this.flash('Objectif du jour atteint : ' + g + ' versets. Bravo !');
  }

  qTapRule(e) {
    const t = e && e.target; if (!t || !t.closest) return;
    const el = t.closest('[data-r]'); const c = el ? el.getAttribute('data-r') : '';
    if (!c || !this.qRuleInfo(c)) return;
    let w = [{ t: el.textContent, st: '' }];
    const wEl = el.closest('.qw'); const m = wEl && /^w-(\d+)-(\d+)$/.exec(wEl.id || '');
    const word = m && this._qwm && (this._qwm.w[+m[1] - 1] || [])[+m[2] - 1];
    if (word) w = word.parts.map((p) => ({ t: p.t, st: p.r === c ? p.st : '' }));
    this.setState({ qRule: { c, w } });
  }

  qRuleGo(c) {
    const R = this.qRuleInfo(c); if (!R || !R.go) return;
    const g = R.go;
    try { this._qBackY = window.scrollY; } catch (x) {}
    this.setState({ qRule: null });
    if (g.level !== this.S().level) this.setLevel(g.level);
    if (g.chap) this.setState({ chap: g.chap });
    this.go(g.screen);
    if (g.anchor) setTimeout(() => { try { const el = document.getElementById(g.anchor); if (el) el.scrollIntoView({ block: 'start' }); } catch (x) {} }, 280);
  }

  qWords(parts, v) {
    const words = []; let cur = null;
    const markOnly = (x) => /^[ۖ-ۭؕ-ؚ]+$/.test(x);
    parts.forEach((p) => {
      String(p.t).split(' ').forEach((piece, i) => {
        if (i > 0) cur = null;
        if (!piece) return;
        if (!cur) {
          if (markOnly(piece) && words.length) { cur = words[words.length - 1]; cur.parts.push({ t: ' ', st: '', r: '' }); }
          else { cur = { parts: [] }; words.push(cur); }
        }
        cur.parts.push({ t: piece, st: p.st, r: p.r || '' });
      });
    });
    return words.map((w, i) => ({ id: 'w-' + v + '-' + (i + 1), parts: w.parts, sp: i < words.length - 1 ? ' ' : '' }));
  }

  // ——— Le Qur’ân : ma voix (le dernier enregistrement de chaque verset reste sur l’appareil, dans IndexedDB) ———
  qDb() {
    if (this._qdb) return this._qdb;
    this._qdb = new Promise((ok, ko) => {
      try {
        const r = window.indexedDB.open('tadjwid-cifod', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('voix')) r.result.createObjectStore('voix'); };
        r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
      } catch (e) { ko(e); }
    });
    this._qdb.catch(() => { this._qdb = null; });
    return this._qdb;
  }

  qDbDo(mode, fn) {
    return this.qDb().then((db) => new Promise((ok, ko) => {
      const tx = db.transaction('voix', mode); const st = tx.objectStore('voix');
      const req = fn(st); tx.oncomplete = () => ok(req && req.result); tx.onerror = () => ko(tx.error); tx.onabort = () => ko(tx.error);
    }));
  }

  // Versets enregistrés de la sourate ouverte (pour afficher « Ma voix » et « Comparer »).
  qRecLoad(n) {
    this.qDbDo('readonly', (st) => st.getAllKeys()).then((keys) => {
      const has = {}; let total = 0;
      (keys || []).forEach((k) => { total++; const m = /^(\d+):(\d+)$/.exec(String(k)); if (m && +m[1] === n) has[+m[2]] = true; });
      this._qHas = has; this.setState({ qRecVer: (this.S().qRecVer || 0) + 1, qRecTotal: total });
    }).catch(() => {});
  }

  qRecStart(v) {
    const s = this.S(); if (s.qRecording) { this.qRecStop(); return; }
    this.qStopAudio(true); this.qMeStop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { this.setState({ qAudioMsg: 'L’enregistrement n’est pas possible sur ce navigateur.' }); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
      const mt = types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      const rec = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined); const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        clearInterval(this._qRecTimer); clearTimeout(this._qRecMax);
        const blob = new Blob(chunks, { type: rec.mimeType || mt || 'audio/webm' });
        const n = this.S().qSurah;
        this.setState({ qRecording: 0, qRecSec: 0 });
        if (!blob.size) return;
        this.qVoiceStart(blob).then((o) => this.qDbDo('readwrite', (st) => st.put({ b: blob, d: Date.now(), o }, n + ':' + v))).then(() => {
          this.flash('Ta récitation du verset ' + v + ' est enregistrée sur cet appareil.'); this.qRecLoad(n);
        }).catch(() => this.flash('Impossible d’enregistrer sur cet appareil.'));
      };
      this._qRec = rec; rec.start();
      const t0 = Date.now();
      this.setState({ qRecording: v, qRecSec: 0, qAudioMsg: '' });
      this._qRecTimer = setInterval(() => this.setState({ qRecSec: Math.floor((Date.now() - t0) / 1000) }), 500);
      this._qRecMax = setTimeout(() => this.qRecStop(), 90000);
    }).catch((e) => this.setState({ qAudioMsg: e && e.name === 'NotAllowedError' ? 'Le micro est refusé : ta voix ne peut pas être enregistrée. Autorise le micro dans les réglages du navigateur. L’écoute des récitateurs, elle, fonctionne sans micro.' : 'Micro inaccessible sur cet appareil.' }));
  }

  qRecStop() {
    try { if (this._qRec && this._qRec.state === 'recording') this._qRec.stop(); } catch (e) {}
  }

  qMeStop() {
    if (this._me) { try { this._me.pause(); } catch (e) {} }
    if (this._meUrl) { try { URL.revokeObjectURL(this._meUrl); } catch (e) {} this._meUrl = null; }
    if (this._me) this._me.removeAttribute('src');
    if (this.S().qMePlaying || this.S().qMeOn) this.setState({ qMePlaying: 0, qMeOn: false });
  }

  // Prépare ma récitation sans la lancer : fichier, et début de la voix après le silence initial.
  qMeLoad(v) {
    const n = this.S().qSurah; const me = this.qMeAud();
    return this.qDbDo('readonly', (st) => st.get(n + ':' + v)).then((r) => {
      if (!r || !r.b) throw new Error('vide');
      const off = typeof r.o === 'number' ? Promise.resolve(r.o) : this.qVoiceStart(r.b);
      return off.then((o) => {
        if (this._meUrl) { try { URL.revokeObjectURL(this._meUrl); } catch (e) {} }
        this._meUrl = URL.createObjectURL(r.b); me.src = this._meUrl; this._meOff = o || 0;
        try { me.load(); } catch (e) {}
        return new Promise((ok) => { if (me.readyState >= 1) ok(); else { me.addEventListener('loadedmetadata', () => ok(), { once: true }); setTimeout(ok, 1500); } });
      });
    });
  }

  qMeGo(v) {
    const me = this.qMeAud();
    try { me.currentTime = this._meOff || 0; } catch (e) {}
    this.setState({ qMePlaying: v, qPlayerOn: true, qPlayV: v, qAudio: 'paused' });
    const p = me.play(); if (p && p.catch) p.catch(() => this.setState({ qMePlaying: 0, qAudioMsg: 'Touche « Ma voix » pour réécouter.' }));
  }

  qMePlay(v) {
    this.qStopAudio(false); this.qMeStop();
    const me = this.qMeAud();
    // Le lecteur est « débloqué » dans le geste (iPhone), puis reçoit l’enregistrement.
    try { const u = me.play(); if (u && u.catch) u.catch(() => {}); } catch (e) {}
    this.qMeLoad(v).then(() => this.qMeGo(v)).catch((e) => this.flash(e && e.message === 'vide' ? 'Aucun enregistrement pour ce verset.' : 'Impossible de lire l’enregistrement.'));
  }

  // Comparer : le récitateur lit le verset, puis ta voix suit aussitôt (préparée pendant la récitation).
  qCompare(v) {
    this.qMeStop();
    const me = this.qMeAud(); try { if (!me.getAttribute('src')) { const u = me.play(); if (u && u.catch) u.catch(() => {}); } } catch (e) {}
    this.qPlay(v, 'verse');
    this._qThenMe = v;
    this._meReadyP = this.qMeLoad(v).catch(() => null);
  }

  // Début de la voix : saute le silence au début de l’enregistrement.
  qVoiceStart(blob) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !blob || !blob.arrayBuffer) return Promise.resolve(0);
      return blob.arrayBuffer().then((buf) => new Promise((ok) => {
        const ctx = new AC(); let fin = false;
        const done = (x) => { if (fin) return; fin = true; try { ctx.close(); } catch (e) {} ok(x); };
        const onBuf = (ab) => {
          const d = ab.getChannelData(0); let peak = 0;
          for (let i = 0; i < d.length; i += 32) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
          const th = Math.max(0.02, peak * 0.12); let idx = 0;
          for (let i = 0; i < d.length; i += 32) { if (Math.abs(d[i]) > th) { idx = i; break; } }
          done(Math.max(0, idx / ab.sampleRate - 0.15));
        };
        try { const pr = ctx.decodeAudioData(buf, onBuf, () => done(0)); if (pr && pr.catch) pr.catch(() => done(0)); } catch (e) { done(0); }
        setTimeout(() => done(0), 4000);
      })).catch(() => 0);
    } catch (e) { return Promise.resolve(0); }
  }

  qMeAud() {
    if (this._me) return this._me;
    const me = new Audio();
    me.addEventListener('ended', () => this.qMeStop());
    me.addEventListener('play', () => { if (me.getAttribute('src')) this.setState({ qMeOn: true }); });
    me.addEventListener('pause', () => this.setState({ qMeOn: false }));
    this._me = me; return me;
  }

  qRecClear() {
    this.qMeStop();
    this.qDbDo('readwrite', (st) => st.clear()).then(() => { this._qHas = {}; this.setState({ qRecVer: (this.S().qRecVer || 0) + 1, qRecTotal: 0, qRecConfirm: false }); this.flash('Tes enregistrements ont été effacés.'); })
      .catch(() => this.setState({ qRecConfirm: false }));
  }

  qRecCount() {
    this.qDbDo('readonly', (st) => st.count()).then((n) => this.setState({ qRecTotal: n || 0 })).catch(() => {});
  }

  // Tanzil place la basmalah au début du premier verset de chaque sourate (sauf Al-Fâtiha et At-Tawbah) :
  // elle est affichée à part, au-dessus de la sourate, et ne fait donc pas partie du verset 1.
  qNoBasmala(n, d) {
    if (n === 1 || n === 9 || !d || !d.v || !d.v[0]) return d;
    const v = d.v[0]; const end = 'ٱلرَّحِيمِ ';
    const k = String(v[0]).indexOf(end);
    if (v[0].charAt(0) !== 'ب' || k < 0 || k > 45) return d;
    const L = k + end.length;
    const ann = (v[2] || []).filter((a) => a[1] > L).map((a) => [Math.max(0, a[0] - L), a[1] - L, a[2]]);
    return Object.assign({}, d, { v: [[v[0].slice(L), v[1], ann]].concat(d.v.slice(1)) });
  }

  qTim(key, n) {
    return this.qOffGet('assets/quran/t/' + key + '/s' + String(n).padStart(3, '0') + '.json').then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then((j) => j.v);
  }

  qGet(what) {
    const url = 'assets/quran/' + (what === 'index' ? 'index' : 's' + String(what).padStart(3, '0')) + '.json';
    return fetch(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  saveDisp(theme, arScale, arFont) {
    try { window.localStorage.setItem('waqf-affichage', JSON.stringify({ theme, arScale, arFont, fv: 2 })); } catch (e) {}
  }

  setTheme(t) {

  // ——— Sauvegarde de la progression (fichier .json) ———
  exportProgress() {
    const s = this.S();
    const payload = {
      app: 'tadjwiid-cifod', format: 1, date: new Date().toISOString(),
      data: { progres: s.prog, records: s.best, programme: s.weeksDone, affichage: { theme: s.theme, arScale: s.arScale, arFont: s.arFont }, coran: { lues: s.qLu || {}, apprises: s.qAp || {}, objectif: s.qGoal || 20, signets: s.qBm || {} } }
    };
    try {
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tadjwid-cifod-sauvegarde-' + payload.date.slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      this.flash('Sauvegarde téléchargée.');
    } catch (e) { this.flash('Le téléchargement a échoué sur cet appareil.'); }
  }

  cleanBackup(j) {
    if (!j || j.app !== 'tadjwiid-cifod' || !j.data || typeof j.data !== 'object') return null;
    const d = j.data;
    const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
    const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);

  exBlocks(list) {
    // Exemples d’un même groupe (ex. « 4 obligatoires ») réunis dans un seul cadre
    const blocks = [];
    list.forEach((e) => {
      const last = blocks[blocks.length - 1];
      if (e.group && last && last.group === e.group) last.items.push(e);
      else blocks.push({ group: e.group || '', items: [e] });
    });
    return blocks.map((b) => ({
      hasTitle: !!b.group, title: b.group,
      items: b.items.map((e, i) => ({ label: String(e.label || '').replace(/ · /g, ', '), parts: e.parts, sepStyle: i ? 'border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px;' : '' }))
    }));
  }

  // Retour : l’écran visité juste avant (l’accueil si la pile est vide)
  goBack() {
    const nv = this._nav || ['home'];
    if (nv[nv.length - 1] === this.S().screen) nv.pop();
    this.go(nv[nv.length - 1] || 'home');

  go(screen) {
    if (screen !== 'quranRead' && this._aud) this.qStopAudio(true);
    if (this.S().qRule) this.setState({ qRule: null });
    if (screen !== 'quranRead') { this.qRecStop(); if (this._me) this.qMeStop(); }
    if (screen === 'settings') { this.qRecCount(); this.qOffCheck(); }
    // Pile des écrans visités, pour le bouton « Retour » (un cran en arrière)
    const nv = this._nav || (this._nav = ['home']);
    // Revenir à un écran déjà dans la pile (« Les sourates ») coupe la pile à cet endroit : pas de doublon
    const at = nv.lastIndexOf(screen);
    if (screen === 'home') this._nav = ['home'];
    else if (at >= 0) nv.length = at + 1;
    else { nv.push(screen); if (nv.length > 30) nv.shift(); }
    // Le compagnon s’ouvre toujours sans le mode mémorisation activé
    if (screen === 'learnComp') this.setState({ screen, hide: false, revealed: {} });
    else this.setState({ screen });
    this.top();
    // Retour au lecteur après une fiche ouverte depuis une lettre : même hauteur qu’avant
    if (screen === 'quranRead' && this._qBackY != null) { const y = this._qBackY; this._qBackY = null; setTimeout(() => { try { window.scrollTo(0, y); } catch (x) {} }, 60); }

  start(mode, topic) {
    const D = this.D();
    const tp = /^(a\d|c\d+)$/.test(topic) || topic === 'types' || topic === 'ra' || topic === 'comp' || topic === 'comp4b' || topic === 'comp4a' || topic === 'idgham' || topic === 'madd' ? topic : 'signes';
    this._bt = tp;
    let queue;
    if (mode === 'review') {
      // Revoir mes erreurs : les questions dont la dernière réponse était fausse
      const idx = this.qIndex(); const pq = this.S().prog.q || {};
      const ids = this.shuffle(Object.keys(idx).filter((id) => idx[id].topic === tp && pq[id] && !pq[id].ok));
      if (!ids.length) return;
      queue = ids.slice(0, Math.max(1, this.count())).map((id) => Object.assign(this.prep(idx[id].mode, idx[id].item), { qid: id }));
    } else if (mode === 'mix') {
      // Mélange : QCM, vrai ou faux et texte à trous, en parts à peu près égales
      const kinds = (tp === 'comp' || tp === 'comp4b' || tp === 'comp4a') ? ['qcm', 'ordre', 'trous'] : ['qcm', 'vf', 'trous'];
      const pools = kinds.map((k) => this.shuffle(D[this.bankKey(k, tp)]).map((it) => [k, it]));
      const all = pools.reduce((a, p) => a + p.length, 0);
      const n = Math.max(1, Math.min(this.count(), all));
      const pick = [];
      for (let r = 0; pick.length < n; r++) { const p = pools[r % 3]; if (p.length) pick.push(p.shift()); }
      queue = this.shuffle(pick).map((x) => Object.assign(this.prep(x[0], x[1]), { qid: this.qidOf(x[0], x[1]) }));
    } else {
      const bank = D[this.bankKey(mode, tp)];
      const n = Math.max(1, Math.min(this.count(), bank.length));
      queue = this.shuffle(bank).slice(0, n).map((it) => Object.assign(this.prep(mode, it), { qid: this.qidOf(mode, it) }));
    }
    this.setState({
      screen: mode, mode, topic: tp, queue, idx: 0, answered: false, picked: null, checked: false,
      score: 0, mistakes: [], picks: [], fills: queue[0].type === 'trous' ? queue[0].answers.map(() => null) : []

    this.top();
  }

  pickOption(i) {
    const s = this.S();
    if (s.answered) return;
    const q = s.queue[s.idx];
    const ok = q.options[i].correct;
    const right = q.options.find((o) => o.correct);
    const P = this.recordAns(q, ok);
    this.saveProg(P);
    this.setState({
      prog: P, answered: true, picked: i, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: q.g || right.sign, v: q.v, prompt: q.p, answer: this.optText(right), explain: q.e }])

  }

  pickVf(v) {
    const s = this.S();

    const q = s.queue[s.idx];
    const ok = v === q.answer;

    this.saveProg(P);

  pickChip(ci) {
    const s = this.S();
    if (s.checked || s.fills.indexOf(ci) !== -1) return;
    const k = s.fills.indexOf(null);

    const f = s.fills.slice();

  // ——— Remets dans l’ordre ———

  resetFills() {
    const s = this.S();

  check() {
    const s = this.S();
    const q = s.queue[s.idx];
    if (s.checked || !q || s.fills.some((x) => x === null)) return;
    const ok = q.answers.every((a, k) => q.bank[s.fills[k]] === a);
    const map = this.D().map;

      const r = ref(g.id);

      const best = Object.assign({}, s.best);
      if (s.mode !== 'review') {
        const key = this.bankKey(s.mode, s.topic);
        const prev = best[key];
        const ratio = s.score / s.queue.length;
        if (!prev || ratio > prev.score / prev.total || (ratio === prev.score / prev.total && s.queue.length > prev.total)) {
          best[key] = { score: s.score, total: s.queue.length };
        }
      }
      const hist = [{ t: Date.now(), topic: s.topic, mode: s.mode, score: s.score, total: s.queue.length }].concat(s.prog.hist || []).slice(0, 50);
      const P = Object.assign({}, s.prog, { hist });
      this.save(best);
      this.saveProg(P);

// Bouton « retour » du téléphone : revenir à l’accueil au lieu de quitter l’application
(function () {
  const go = comp.go.bind(comp), start = comp.start.bind(comp);
  let fromPop = false;
  try { history.replaceState({ s: 'home' }, ''); } catch (e) {}
  comp.go = function (s) {
    go(s);
    if (fromPop) return;
    try { if (s === 'home') history.replaceState({ s: 'home' }, ''); else history.pushState({ s: s }, ''); } catch (e) {}
  };
  comp.start = function (m, t) { start(m, t); try { history.pushState({ s: m }, ''); } catch (e) {} };
  window.addEventListener('popstate', function () { fromPop = true; go('home'); fromPop = false; });
})();

// Mode hors ligne, installation sur l’écran d’accueil et message de mise à jour
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    const banner = document.getElementById('update-banner');
    let accepted = false;
    function showBanner(worker) {
      banner.style.display = 'flex';
      document.getElementById('update-now').onclick = function () {
        accepted = true;
        document.getElementById('update-now').textContent = 'Mise à jour…';
        worker.postMessage({ type: 'SKIP_WAITING' });
      };
      document.getElementById('update-later').onclick = function () { banner.style.display = 'none'; };
    }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (accepted) window.location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) showBanner(reg.waiting);
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showBanner(nw);
        });
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
