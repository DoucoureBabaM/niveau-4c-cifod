<style>[v-cloak]{display:none}</style>

<body>
<div id="app" v-cloak>
<div :data-theme="themeName" :style="`${themeVars} padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Manrope', 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column`">

<header style="border-bottom: 1px solid var(--line)">
<div style="max-width: 760px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">

<button @click="goHome" aria-label="Retour à l’accueil" style="display: flex; align-items: center; background: none; border: 0; padding: 4px; min-height: 48px; border-radius: 12px; flex-shrink: 0">
<img src="assets/logo_psalmodie.svg" alt="" style="width: 52px; height: 52px; display: block; flex-shrink: 0">
</button>
<figure style="margin: 0; min-width: 0; max-width: 540px">
<blockquote style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.45; color: var(--ink2); text-transform: uppercase; text-wrap: pretty">«&nbsp;Récitez le Qurân, car le jour de la Résurrection, il viendra intercéder en faveur de ses lecteurs assidus.&nbsp;» <cite style="font-style: normal; font-size: 10px; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap">(Muslim)</cite></blockquote>

</div>

<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
Quitter
</button>
</template>
</div>
</header>

<main style="flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; display: flex; flex-direction: column; gap: 20px">

<template v-if="isHome">
<section class="rise" style="display: flex; flex-direction: column; gap: 26px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">

</div>

<span style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 16px; font-weight: 800">Mes progrès</span><span :style="`font-size: 14px; font-weight: 800; color: ${accent}`">{{progAll.pct}}&nbsp;% maîtrisé</span></span><div aria-hidden="true" style="height: 6px; border-radius: 999px; background: var(--surface3); overflow: hidden"><div :style="`height: 100%; width: ${progAll.barW}; background: var(--accent); border-radius: 999px`"></div></div><span style="font-size: 12.5px; font-weight: 600; color: var(--muted)">{{progAll.sub}}</span></span>
</button>
<div style="display: flex; align-items: center; justify-content: center; gap: 16px">
<p style="margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left"><span style="font-size: clamp(17px, 2.6vw, 22px); font-weight: 800; font-style: italic; line-height: 1.25; color: var(--ink)">Le viatique du lecteur</span><span style="font-size: clamp(14px, 2vw, 17px); font-weight: 600; line-height: 1.3; color: var(--muted)">Règles de la Psalmodie du QUR’ÂN</span></p>
<img src="assets/viatique_cercle.jpg" alt="Couverture du livre « Le Viatique du Lecteur » (CIFOD)" style="width: clamp(72px, 15vw, 104px); height: clamp(72px, 15vw, 104px); display: block; flex-shrink: 0; border-radius: 999px; object-fit: cover; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line), 0 8px 22px rgba(20,32,28,0.12)">
</div>
<template v-if="lvl.is4C"><p style="margin: 0; font-size: 17px; line-height: 1.55; color: var(--muted); max-width: 580px; text-wrap: pretty">Les règles de la lettre Ra, les types d’arrêts et les signes conventionnels des arrêts&nbsp;: apprends-les avec les fiches, puis révise-les en QCM, vrai/faux, texte à trous et mélange.</p></template>
<template v-if="lvl.is4B"><p style="margin: 0; font-size: 17px; line-height: 1.55; color: var(--muted); max-width: 580px; text-wrap: pretty">Les différents types d’assimilations et les prolongations&nbsp;: apprends-les avec les fiches, puis révise-les avec les exercices. Les chapitres du niveau 4B sont en préparation.</p></template>
</div>
<template v-if="lvl.is4C">

<span dir="rtl" lang="ar" aria-hidden="true" :style="`font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri', serif; font-weight: 400; font-size: calc(26px * var(--ar, 1)); line-height: 1.7; color: ${accent}`">أَحۡكَامُ ٱلۡحَرۡفِ ٱلرَّاءِ</span>

<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Vrai ou faux</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: var(--muted)">{{metaR.vf}}</span></span>

</button>
</div>
<button class="lift" @click="startRMix" style="margin-top: -10px; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px; min-height: 72px">
<span :style="`width: 38px; height: 38px; border-radius: 11px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center; flex-shrink: 0`"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg></span>

<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Revoir mes erreurs</span><span style="font-size: 12.5px; font-weight: 600; color: var(--muted)">{{progR.koLabel}} à revoir</span></span>
</button>

<div style="margin-top: -6px; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted)"><span>Progression</span><span>{{progR.pct}}&nbsp;% maîtrisé · {{progR.ok}}/{{progR.total}}</span></div><div aria-hidden="true" style="height: 6px; border-radius: 999px; background: var(--surface3); overflow: hidden"><div :style="`height: 100%; width: ${progR.barW}; background: var(--accent); border-radius: 999px`"></div></div></div>
</section>

<span style="width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 1 3 17V5.5Z"></path><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h6A1.5 1.5 0 0 0 21 17V5.5Z"></path></svg></span>

<section aria-labelledby="h-arbre8" style="background: var(--surface2); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px"><h2 id="h-arbre8" style="margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800">Résumé&nbsp;: l’arbre des assimilations</h2><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9; color: var(--accent)">ٱلۡإِدۡغَامُ</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 0"><span style="font-size: 16px; font-weight: 800; color: #FFFFFF; background: var(--accent); padding: 6px 22px; border-radius: 999px">Idghâm</span><span aria-hidden="true" style="width: 2px; height: 16px; background: var(--line2)"></span><span aria-hidden="true" style="width: 70%; height: 2px; background: var(--line2)"></span></div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--accent)"><span style="align-self: flex-start; font-size: 15px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--surface3)">1. Idghâm al-Moutamâthilayn</span><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Si <strong>2 lettres identiques</strong> se suivent, la 1<sup>re</sup> étant neutre et la 2<sup>e</sup> vocalisée, elles fusionnent <strong>sans nasillement</strong>.</p><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span></span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">إِ<span style="color: var(--red)">ذ ذَّ</span>هَبَ</span></div><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span></span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">وَقَ‍<span style="color: var(--red)">‍د دَّ</span>خَلُواْ</span></div><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Pour les lettres <strong>Mîm (م) et Noûn (ن)</strong>, un nasillement de 2 temps est <strong>obligatoire</strong>.</p><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span style="font-size: 12.5px; font-weight: 700; color: var(--muted)">Idghâm bi ghunna</span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">مِّ‍<span style="color: var(--red)">‍ن نَّ‍</span>‍خِيلٖ</span></div><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span style="font-size: 12.5px; font-weight: 700; color: var(--muted)">Idghâm chafawy</span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">وَءَامَنَهُ‍<span style="color: var(--red)">‍م مِّ‍</span>‍نۡ خَوۡفِۭ</span></div></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--green)"><span style="align-self: flex-start; font-size: 15px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--surface3)">2. Idghâm al-Moutadjânissayn</span><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">C’est la rencontre de <strong>2 lettres affinitaires</strong> (qui ont des affinités) : elles ont le <strong>même point de sortie</strong> mais des <strong>attributs différents</strong>. Il y a fusion de la 1<sup>re</sup> lettre dans la 2<sup>e</sup>.</p><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Il y a <strong>7 cas</strong> possibles dans le Qur’ân :</p><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.5"><li>Dâl (د) dans Tâ (ت)</li><li>Tâ (ت) dans Dâl (د)</li><li>Tâ (ت) dans Ṯô (ط)</li><li>Ṯô (ط) dans Tâ (ت) — <strong>fusion partielle</strong></li><li>Dzâl (ذ) dans Ẕô (ظ)</li><li>Thâ (ث) dans Dzâl (ذ)</li><li>Bâ (ب) dans Mîm (م)</li></ul></div>

<script>
const PROPS = { accent: '#0B5D4B', questions: 10 };
let render = function () {};
class DCLogic {
  constructor() { this.props = PROPS; this.state = null; }
  setState(patch) { this.state = Object.assign({}, this.state || {}, typeof patch === 'function' ? patch(this.state) : patch); render(); }
  forceUpdate() { render(); }
}
class Component extends DCLogic {
  D() {
    if (this._d) return this._d;
    const fr = (t) => String(t).replace(/ ([:;?!»])/g, '\u00a0$1').replace(/« /g, '«\u00a0');
    const signs = [
      { id: 'mim', glyph: 'مـ', nom: 'Mîm', aria: 'Signe de l’arrêt obligatoire', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt obligatoire', liaison: 'Interdite', signal: 'stop', note: '' },
      { id: 'sin', glyph: 'س', nom: 'Sîn', aria: 'Signe de l’arrêt obligatoire en 4 cas', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt obligatoire (4 cas)', liaison: 'Interdite (4 cas) · Autorisée (2 cas)', signal: null, note: 'Pause légère.' },
      { id: 'qala', glyph: 'قلى', nom: 'Qalâ', aria: 'Signe Qalâ', tone: 'red', scale: 0.78, group: 'arret', designation: 'Arrêt prioritaire', liaison: 'Autorisée', signal: 'orange', note: '' },
      { id: 'jim', glyph: 'ج', nom: 'Jîm', aria: 'Signe de l’arrêt autorisé', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt autorisé', liaison: 'Autorisée', signal: 'orange', note: '' },
      { id: 'sala', glyph: 'صلى', nom: 'Salâ', aria: 'Signe Salâ', tone: 'green', scale: 0.78, group: 'arret', designation: 'Arrêt autorisé', liaison: 'Prioritaire', signal: 'orange', note: '' },
      { id: 'la', glyph: 'لا', nom: 'Lâ', aria: 'Signe de l’arrêt interdit', tone: 'green', scale: 1, group: 'arret', designation: 'Arrêt interdit', liaison: 'Obligatoire', signal: 'blue', note: '' },
      { id: 'dots', glyph: '∴ ∴', nom: 'Trois points', aria: 'Paire de trois points', tone: 'green', scale: 0.6, group: 'arret', designation: 'Arrêt autorisé (1 des 2)', liaison: 'Autorisée', signal: 'orange', note: 'Les points vont par paire : on s’arrête à l’un des deux, pas aux deux.' },
      { id: 'sajda', glyph: '۩', nom: '', aria: 'Symbole de prosternation', tone: 'maroon', scale: 0.95, group: 'autre', designation: 'Prosternation', liaison: null, signal: null, note: 'Il est recommandé de se prosterner au niveau de ce symbole. Le mot ou l’expression qui induit la prosternation est marqué(e) d’un trait horizontal au-dessus.' },
      { id: 'hizb', glyph: '۞', nom: '', aria: 'Symbole de fin de section', tone: 'maroon', scale: 0.95, group: 'autre', designation: 'Fin d’une section', liaison: null, signal: null, note: 'Fin d’un Djouz’ (1/30 du Coran), d’un Hizb (1/60), ou d’un Roub’ / Nisf de Hizb (quart et moitié de Hizb).' },
      { id: 'ayah', glyph: '۝١', nom: '', aria: 'Symbole de fin de verset', tone: 'maroon', scale: 0.85, group: 'autre', designation: 'Fin de verset', liaison: null, signal: null, note: 'Le numéro du verset est inscrit dans le symbole.' }
    ].map((s) => Object.assign({}, s, { designation: fr(s.designation), note: fr(s.note), liaison: s.liaison ? fr(s.liaison) : null }));

    const book = {
      mim: { name: 'L’arrêt obligatoire', tr: 'Al-Waqf Al-Lâzim', ar: 'اَلۡوَقۡفُ اللَّازِمُ',
        def: 'C’est l’arrêt qui permet à la phrase d’être complète grammaticalement et du point de vue du sens. Ce type d’arrêt est qualifié de « parfait » car le discours est complet et indépendant de ce qui suit.',
        letter: 'Il est représenté par la lettre Mîm.',
        ex: [{ label: 'Exemple · Sourate 6, verset 36', text: 'إِنَّمَا يَسۡتَجِيبُ ٱلَّذِينَ يَسۡمَعُونَ ۘ وَٱلۡمَوۡتَىٰ يَبۡعَثُهُمُ ٱللَّهُ ثُمَّ إِلَيۡهِ يُرۡجَعُونَ' }] },
      jim: { name: 'L’arrêt permis', tr: 'Al-Waqf Al-Jâiz', ar: 'اَلۡوَقۡفُ الۡجَائِزُ',
        def: 'Il indique un endroit où il est permis soit de s’arrêter soit de continuer sans que l’une de ces deux possibilités soit prioritaire.',
        letter: 'Il est représenté par la lettre Djîm.',
        ex: [{ label: 'Exemple · Sourate 110, verset 3', text: 'وَٱسۡتَغۡفِرۡهُ ۚ إِنَّهُۥ كَانَ تَوَّابًۢا …' }] },
      sala: { name: 'L’arrêt permis avec la préférence de continuer', tr: 'Al-Waqf Al-Jâiz ma’a kaw al-wasl awlâ', ar: 'اَلۡوَقۡفُ الۡجَائِزُ مَعَ كَوۡنِ الۡوَصۡلِ الۡأَوۡلَى',
        def: 'Il indique un endroit où il est permis de s’arrêter ou de continuer, mais la continuation est préférable.',
        letter: 'Il est représenté par la lettre Sôd-lam.',
        ex: [{ label: 'Exemple · Sourate 104, verset 4', text: 'كَلَّا ۖ لَيُنۢبَذَنَّ …' }] },
      qala: { name: 'L’arrêt permis avec la préférence de s’arrêter', tr: 'Al-Waqf Al-Jâiz ma’a kaw Al-Waqf Awlâ', ar: 'اَلۡوَقۡفُ الۡجَائِزُ مَعَ كَوۡنِ الۡوَقۡفِ الۡأَوۡلَى',
        def: 'Il indique un endroit où il est permis de s’arrêter ou de continuer, mais l’arrêt est préférable.',
        letter: 'Il est représenté par les lettres Qôf-lâm.',
        ex: [{ label: 'Exemple · Sourate 61, verset 13', text: '… وَفَتۡحٌ قَرِيبٌ ۗ وَبَشِّرِ ٱلۡمُؤۡمِنِينَ' }] },
      dots: { name: 'L’arrêt lié au suivant', tr: 'Al-Waqf Al-Mouraqqabah', ar: 'اَلۡوَقۡفُ الۡمُرَقَّبَة',
        def: 'Il s’agit de deux endroits où il est possible de s’arrêter, mais on ne peut s’arrêter que sur l’un d’eux seulement.',
        letter: 'Il est représenté par ces 2 fois trois points.',
        ex: [{ label: 'Exemple · Sourate 2, verset 2', text: 'ذَٰلِكَ ٱلۡكِتَٰبُ لَا رَيۡبَ ۛ فِيهِ ۛ هُدًى لِّلۡمُتَّقِينَ' }] },
      la: { name: 'L’arrêt interdit', tr: 'Al-Waqf Al-Mamnoû’', ar: 'اَلۡوَقۡفُ الۡمَمۡنُوعُ',
        def: 'Il indique un endroit où il est défendu de s’arrêter, car, si on le faisait la phrase ne serait pas complète et le sens ne serait pas compréhensible, parce que ce qui précède cet endroit dépend de ce qui le suit grammaticalement et du point de vue du sens.',
        letter: 'Il est représenté par les lettres Lâm-Alif.',
        ex: [{ label: 'Exemple · Sourate 73, verset 20', text: '… وَءَاخَرُونَ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۙ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُ …' }] },
      sin: { name: 'La pause légère', tr: 'As-sakta Al-la ṭîfah', ar: 'اَلسَّكۡتَةُ اللَّطِيفَةُ',
        def: 'C’est l’arrêt sur un mot du Coran, sans reprendre sa respiration, pour un bref instant. Cette pause n’existe qu’à 6 endroits dans la lecture selon le lectionnaire Hafs conformément à Châṭubiyy.',
        letter: 'Il est représenté par la lettre ci-contre. Exemples : 4 obligatoires et 2 autorisés.',
        ex: [
          { label: 'Sourate 18, verset 1', group: '4 obligatoires', sinShift: { left: '0.3em', top: '-0.18em' }, text: '… وَلَمۡ يَجۡعَل لَّهُۥ عِوَجَا ۜ ١ قَيِّمًا لِّيُنذِرَ بَأۡسًا شَدِيدًا مِّن لَّدُنۡهُ …' },
          { label: 'Sourate 36, verset 52', group: '4 obligatoires', text: '… مِن مَّرۡقَدِنَا ۜ ۗ هَٰذَا …' },
          { label: 'Sourate 75, verset 27', group: '4 obligatoires', sinShift: { left: '0.34em', top: '-0.12em', ws: '-0.2em' }, text: 'وَقِيلَ مَنۡ ۜ رَاقٍ' },
          { label: 'Sourate 83, verset 14', group: '4 obligatoires', sinShift: { left: '0.3em', top: '-0.38em', ws: '-0.2em' }, text: 'كَلَّا ۖ بَلۡ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ' },
          { label: 'Autorisée · Sourate Al-Hâqqah, versets 28 et 29', sinShift: { left: '0.32em', top: '-0.14em' }, text: 'مَآ أَغۡنَىٰ عَنِّى مَالِيَهۡ ۜ ٢٨ هَلَكَ عَنِّى سُلۡطَٰنِيَهۡ' },
          { label: 'Autorisée · Fin d’Al-Anfâl et début d’At-Tawbah', sinShift: { left: '0.3em', top: '-0.2em', ws: '-0.2em' }, text: '… إِنَّ ٱللَّهَ بِكُلِّ شَىۡءٍ عَلِيمۡ ۜ بَرَآءَةٌ مِّنَ ٱللَّهِ وَرَسُولِهِۦٓ …' }
        ],
        note: 'Lorsque le signe de pause légère coïncide avec la fin d’un verset ou avec un signe d’arrêt, le lecteur a le choix entre l’arrêt et la pause légère (d’où l’obligation d’arrêt). C’est le cas des deux premiers versets des exemples.' }
    };
    signs.forEach((s) => {
      const b = book[s.id];
      s.book = b ? { name: fr(b.name), tr: b.tr, ar: b.ar, def: fr(b.def), letter: fr(b.letter), note: b.note ? fr(b.note) : '', ex: b.ex.map((e) => ({ label: fr(e.label), group: e.group ? fr(e.group) : '', text: e.text, parts: this.redParts(e.text, e.sinShift) })) } : null;
    });
    const map = {};
    signs.forEach((s) => { map[s.id] = s; });

    const qcm = [

      try { flag = window.localStorage.getItem('waqf-installe') === '1'; } catch (e) {}
      if (isStandalone()) markInstalled(); else if (flag) this.setState({ installed: true });

    } catch (e) {}
    try {
      if (window.caches && window.caches.keys) {
        window.caches.keys().then((keys) => {

  hash(t) {
    let h = 5381; const x = String(t);

    return (h >>> 0).toString(36);

  qidOf(mode, it) {

    if (this._qi) return this._qi;

  topicStats(tp) {
    const idx = this.qIndex(); const pq = this.S().prog.q || {};
    let total = 0, seen = 0, ok = 0, ko = 0;
    Object.keys(idx).forEach((id) => {
      if (idx[id].topic !== tp) return;
      total++;
      const r = pq[id];
      if (r) { seen++; if (r.ok) ok++; else ko++; }
    });
    return { total, seen, ok, ko, pct: total ? Math.round(ok * 100 / total) : 0 };
  }

  recordAns(q, ok) {
    const s = this.S();
    const pq = Object.assign({}, s.prog.q);
    if (q && q.qid) {
      const r = pq[q.qid] || { n: 0, miss: 0 };
      pq[q.qid] = { n: r.n + 1, miss: r.miss + (ok ? 0 : 1), ok: !!ok };
    }
    return Object.assign({}, s.prog, { q: pq });
  }

  saveProg(p) {
    try { window.localStorage.setItem('waqf-progres', JSON.stringify(p)); } catch (e) {}
  }

  resetProgress() {
    const empty = { qcm: null, vf: null, trous: null, tqcm: null, tvf: null, ttrous: null };
    this.setState({ prog: { q: {}, hist: [] }, best: empty, confirmReset: false });
    this.saveProg({ q: {}, hist: [] });
    this.save(empty);
  }

  toggleWeek(n) {
    const w = Object.assign({}, this.S().weeksDone || {});
    if (this.S().level === '4B') n = 'b' + n;
    if (w[n]) delete w[n]; else w[n] = true;
    this.setState({ weeksDone: w });
    try { window.localStorage.setItem('waqf-programme', JSON.stringify(w)); } catch (e) {}
  }

  }

  shareApp() {
    const url = 'https://niveau-4c-cifod.netlify.app/';
    const data = { title: 'Niveau 4C — CIFOD', text: 'Révise les règles de la lettre Ra, les types d’arrêts et les signes conventionnels des arrêts du Coran.', url };
    const toast = (m) => {
      this.setState({ toast: m });
      clearTimeout(this._toastT);
      this._toastT = setTimeout(() => this.setState({ toast: '' }), 3500);
    };
    const copy = () => {
      try {
        navigator.clipboard.writeText(url).then(() => toast('Lien copié : ' + url), () => toast('Lien de l’application : ' + url));
      } catch (e) { toast('Lien de l’application : ' + url); }
    };
    try {
      if (navigator.share) {
        navigator.share(data).catch((err) => { if (!err || err.name !== 'AbortError') copy(); });

      }

  count() {

    return isNaN(v) ? 10 : Math.max(3, Math.min(20, v));
  }

  shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  exBlocks(list) {
    // Exemples d’un même groupe (ex. « 4 obligatoires ») réunis dans un seul cadre
    const blocks = [];
    list.forEach((e) => {
      const last = blocks[blocks.length - 1];
      if (e.group && last && last.group === e.group) last.items.push(e);
      else blocks.push({ group: e.group || '', items: [e] });
    });
    return blocks.map((b) => ({
      hasTitle: !!b.group, title: b.group,
      items: b.items.map((e, i) => ({ label: e.label, parts: e.parts, sepStyle: i ? 'border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px;' : '' }))
    }));
  }

  hlParts(t) {
    // Couleurs du livre : [[r:…]] rouge (le Rô), [[g:…]] vert, [[b:…]] bleu.
    // À une frontière à l’intérieur d’un mot, on ajoute un « liant invisible » (ZWJ)
    // pour que les lettres restent attachées même si le navigateur traite chaque couleur à part.
    const COL = { r: 'var(--red)', g: 'var(--green)', b: 'var(--blue)' };
    const parts = String(t || '').split(/(\[\[[rgb]:[^\]]*\]\])/).filter((x) => x).map((x) => {
      const m = x.match(/^\[\[([rgb]):([^\]]*)\]\]$/);
      return m ? { text: m[2], color: COL[m[1]] } : { text: x, color: 'inherit' };
    });
    const MARK = /[\u064B-\u065F\u0670\u06D6-\u06ED\u08F0-\u08FF\u200D]/;
    const DUAL = 'بتثجحخسشصضطظعغفقكلمنهيئىٮٯـ';
    const isAr = (ch) => /[\u0620-\u064A\u0671-\u06D3]/.test(ch);
    for (let k = 0; k < parts.length - 1; k++) {
      const a = parts[k].text; const b = parts[k + 1].text;
      let p = a.length - 1; while (p >= 0 && MARK.test(a[p])) p--;
      const last = p >= 0 ? a[p] : '';
      if (last && DUAL.indexOf(last) >= 0 && b.length && isAr(b[0])) {
        parts[k].text = a + '\u200D'; parts[k + 1].text = '\u200D' + b;
      }
    }
    return parts.map((x) => ({ text: x.text, style: 'color: ' + x.color + ';' }));
  }

  verse(id) {
    const ex = id ? this.D().EX[id] : null;
    if (!ex) return { isPair: false, isSingle: false, before: '', after: '', text: '', ref: '', num: '', beforeParts: [], afterParts: [], textParts: [] };
    return { isPair: !!ex.before, isSingle: !ex.before, before: ex.before || '', after: ex.after || '', text: ex.text || '', ref: ex.ref, num: ex.num || '',
      beforeParts: this.redParts(ex.before), afterParts: this.redParts(ex.after), textParts: this.redParts(ex.text) };
  }

  go(screen) {
    this.setState({ screen });
    this.top();
  }

  start(mode, topic) {
    const D = this.D();
    const tp = topic === 'types' || topic === 'ra' || topic === 'comp' || topic === 'comp4b' || topic === 'idgham' || topic === 'madd' ? topic : 'signes';
    this._bt = tp;
    let queue;
    if (mode === 'review') {
      // Revoir mes erreurs : les questions dont la dernière réponse était fausse
      const idx = this.qIndex(); const pq = this.S().prog.q || {};
      const ids = this.shuffle(Object.keys(idx).filter((id) => idx[id].topic === tp && pq[id] && !pq[id].ok));
      if (!ids.length) return;
      queue = ids.slice(0, Math.max(1, this.count())).map((id) => Object.assign(this.prep(idx[id].mode, idx[id].item), { qid: id }));
    } else if (mode === 'mix') {
      // Mélange : QCM, vrai ou faux et texte à trous, en parts à peu près égales
      const kinds = (tp === 'comp' || tp === 'comp4b') ? ['qcm', 'ordre', 'trous'] : ['qcm', 'vf', 'trous'];
      const pools = kinds.map((k) => this.shuffle(D[this.bankKey(k, tp)]).map((it) => [k, it]));
      const all = pools.reduce((a, p) => a + p.length, 0);
      const n = Math.max(1, Math.min(this.count(), all));
      const pick = [];
      for (let r = 0; pick.length < n; r++) { const p = pools[r % 3]; if (p.length) pick.push(p.shift()); }
      queue = this.shuffle(pick).map((x) => Object.assign(this.prep(x[0], x[1]), { qid: this.qidOf(x[0], x[1]) }));
    } else {
      const bank = D[this.bankKey(mode, tp)];
      const n = Math.max(1, Math.min(this.count(), bank.length));
      queue = this.shuffle(bank).slice(0, n).map((it) => Object.assign(this.prep(mode, it), { qid: this.qidOf(mode, it) }));
    }
    this.setState({
      screen: mode, mode, topic: tp, queue, idx: 0, answered: false, picked: null, checked: false,
      score: 0, mistakes: [], picks: [], fills: queue[0].type === 'trous' ? queue[0].answers.map(() => null) : []
    });
    this.top();
  }

  pickOption(i) {
    const s = this.S();
    if (s.answered) return;
    const q = s.queue[s.idx];
    const ok = q.options[i].correct;
    const right = q.options.find((o) => o.correct);
    const P = this.recordAns(q, ok);
    this.saveProg(P);
    this.setState({
      prog: P, answered: true, picked: i, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: q.g || right.sign, v: q.v, prompt: q.p, answer: this.optText(right), explain: q.e }])
    });
  }

  pickVf(v) {
    const s = this.S();
    if (s.answered) return;
    const q = s.queue[s.idx];
    const ok = v === q.answer;
    const P = this.recordAns(q, ok);
    this.saveProg(P);
    this.setState({
      prog: P, answered: true, picked: v, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: q.g, v: q.v, prompt: q.p, answer: q.answer ? 'Vrai' : 'Faux', explain: q.e }])
    });
  }

  pickChip(ci) {
    const s = this.S();
    if (s.checked || s.fills.indexOf(ci) !== -1) return;
    const k = s.fills.indexOf(null);
    if (k === -1) return;
    const f = s.fills.slice();
    f[k] = ci;
    this.setState({ fills: f });
  }

  // ——— Remets dans l’ordre ———
  pickOrd(ci) {
    const s = this.S(); const p = s.picks || [];
    if (s.checked || p.indexOf(ci) !== -1) return;
    this.setState({ picks: p.concat([ci]) });
  }

  unpickOrd(k) {
    const s = this.S(); const p = (s.picks || []).slice();
    if (s.checked) return;
    p.splice(k, 1);
    this.setState({ picks: p });
  }

  resetOrd() {
    if (this.S().checked) return;
    this.setState({ picks: [] });
  }

  checkOrd() {
    const s = this.S(); const q = s.queue[s.idx]; const p = s.picks || [];
    if (s.checked || !q || p.length !== q.words.length) return;
    const ok = p.map((ci) => q.bank[ci]).join(' ') === q.words.join(' ');
    const P = this.recordAns(q, ok);
    this.saveProg(P);
    this.setState({
      prog: P, checked: true, answered: true, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: null, v: null, prompt: q.fr, answer: '\u2067' + q.words.join(' ') + '\u2069', explain: q.e }])
    });
  }

  clearBlank(k) {
    const s = this.S();
    if (s.checked) return;
    const f = s.fills.slice();
    f[k] = null;
    this.setState({ fills: f });
  }

  resetFills() {
    const s = this.S();
    if (s.checked) return;
    this.setState({ fills: s.fills.map(() => null) });
  }

  check() {
    const s = this.S();
    const q = s.queue[s.idx];
    if (s.checked || !q || s.fills.some((x) => x === null)) return;
    const ok = q.answers.every((a, k) => q.bank[s.fills[k]] === a);
    const map = this.D().map;
    const AR = this.D().AR;
    const ref = (id) => (AR[id] ? AR[id] : id === 'qala' || id === 'sala' ? map[id].nom : 'ci-contre');
    const first = q.segs.find((g) => g.type === 'glyph' && map[g.id]);
    const full = q.segs.map((g, i) => {
      if (g.type === 'text') return g.text;
      if (g.type !== 'glyph') return q.answers[g.k];
      const r = ref(g.id);
      const prev = i > 0 && q.segs[i - 1].type === 'text' ? q.segs[i - 1].text : '';
      return r === 'ci-contre' && !/(signe|symbole|paire)\s*$/.test(prev) ? 'le signe ci-contre' : r;
    }).join('');
    const P = this.recordAns(q, ok);
    this.saveProg(P);
    this.setState({
      prog: P, checked: true, answered: true, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: first ? first.id : null, prompt: q.ar ? '\u2067' + full + '\u2069' : full, answer: q.ar ? '\u2067' + q.answers.join(' · ') + '\u2069' : q.answers.join(' · '), explain: q.e }])
    });
  }

  next() {
    const s = this.S();
    const n = s.idx + 1;
    if (n >= s.queue.length) {
      const best = Object.assign({}, s.best);
      if (s.mode !== 'review') {
        const key = this.bankKey(s.mode, s.topic);
        const prev = best[key];
        const ratio = s.score / s.queue.length;
        if (!prev || ratio > prev.score / prev.total || (ratio === prev.score / prev.total && s.queue.length > prev.total)) {
          best[key] = { score: s.score, total: s.queue.length };
        }
      }
      const hist = [{ t: Date.now(), topic: s.topic, mode: s.mode, score: s.score, total: s.queue.length }].concat(s.prog.hist || []).slice(0, 50);
      const P = Object.assign({}, s.prog, { hist });
      this.save(best);
      this.saveProg(P);
      this.setState({ screen: 'result', best, prog: P });
    } else {
      const nq = s.queue[n];
      this.setState({ idx: n, answered: false, picked: null, checked: false, picks: [], fills: nq.type === 'trous' ? nq.answers.map(() => null) : [] });
    }
    this.top();
  }

// Bouton « retour » du téléphone : revenir à l’accueil au lieu de quitter l’application
(function () {
  const go = comp.go.bind(comp), start = comp.start.bind(comp);
  let fromPop = false;
  try { history.replaceState({ s: 'home' }, ''); } catch (e) {}
  comp.go = function (s) {
    go(s);
    if (fromPop) return;
    try { if (s === 'home') history.replaceState({ s: 'home' }, ''); else history.pushState({ s: s }, ''); } catch (e) {}
  };
  comp.start = function (m, t) { start(m, t); try { history.pushState({ s: m }, ''); } catch (e) {} };
  window.addEventListener('popstate', function () { fromPop = true; go('home'); fromPop = false; });
})();

// Mode hors ligne, installation sur l’écran d’accueil et message de mise à jour
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    const banner = document.getElementById('update-banner');
    let accepted = false;
    function showBanner(worker) {
      banner.style.display = 'flex';
      document.getElementById('update-now').onclick = function () {
        accepted = true;
        document.getElementById('update-now').textContent = 'Mise à jour…';
        worker.postMessage({ type: 'SKIP_WAITING' });
      };
      document.getElementById('update-later').onclick = function () { banner.style.display = 'none'; };
    }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (accepted) window.location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) showBanner(reg.waiting);
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showBanner(nw);
        });
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
