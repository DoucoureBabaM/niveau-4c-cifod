<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niveau 4C — Arrêts et signes du Coran</title>
<meta name="description" content="Apprendre et réviser les types d’arrêts et les signes conventionnels de la lecture du Coran : fiches, QCM, vrai ou faux et texte à trous.">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F4F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Niveau 4C">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Amiri+Quran&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
@font-face{font-family:'Hafs';src:url('assets/kfgqpc_hafs.ttf') format('truetype');font-display:swap}
body{margin:0;background:#F3F4F0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
button:not(:disabled){cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #1F4F8F;outline-offset:2px}
a{color:#0B5D4B}a:hover{color:#08463A}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.lift{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.lift:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,32,28,.08)}
@media (prefers-reduced-motion: reduce){.rise{animation:none}.lift{transition:none}.lift:hover:not(:disabled){transform:none}}
</style>
<style>[v-cloak]{display:none}</style>
</head>
<body>
<div id="app" v-cloak>
<div style="min-height: 100vh; background: #F3F4F0; color: #14201C; font-family: 'Manrope', 'Hafs', 'Amiri', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">

<header style="border-bottom: 1px solid #DCE0DA">
<div style="max-width: 760px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<button @click="goHome" aria-label="Retour à l’accueil" style="display: flex; align-items: center; background: none; border: 0; padding: 4px; min-height: 48px; border-radius: 12px; flex-shrink: 0">
<img src="assets/logo_psalmodie.svg" alt="" style="width: 52px; height: 52px; display: block; flex-shrink: 0">
</button>
<figure style="margin: 0; min-width: 0; max-width: 540px">
<blockquote style="margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.45; color: #24452F; text-transform: uppercase; text-wrap: pretty">«&nbsp;Récitez le Qurân, car le jour de la Résurrection, il viendra intercéder en faveur de ses lecteurs assidus.&nbsp;» <cite style="font-style: normal; font-size: 10px; letter-spacing: 0.06em; color: #55625D; white-space: nowrap">(Muslim)</cite></blockquote>
</figure>
</div>
<template v-if="showQuit">
<button @click="quit" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #DCE0DA; background: #FFFFFF; font-size: 14px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
Quitter
</button>
</template>
</div>
</header>

<main style="flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; display: flex; flex-direction: column; gap: 20px">

<template v-if="isHome">
<section class="rise" style="display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<p :style="`margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: ${accent}`">Apprendre · Réviser</p>
<div style="display: flex; align-items: center; justify-content: center; gap: 16px">
<p style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center"><span style="font-size: clamp(17px, 2.6vw, 22px); font-weight: 800; font-style: italic; line-height: 1.25; color: #14201C">Le viatique du lecteur</span><span style="font-size: clamp(14px, 2vw, 17px); font-weight: 600; line-height: 1.3; color: #55625D">Règles de la Psalmodie du QUR’ÂN</span></p>
<img src="assets/viatique_cercle.jpg" alt="Couverture du livre « Le Viatique du Lecteur » (CIFOD)" style="width: clamp(88px, 18vw, 128px); height: clamp(88px, 18vw, 128px); display: block; flex-shrink: 0; border-radius: 999px; object-fit: cover; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4px #DCE0DA, 0 8px 22px rgba(20,32,28,0.12)">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px">
<img src="assets/cifod_cercle.png" alt="Banderole du CIFOD : Apprendre à lire le Coran en 3 mois" style="width: 52px; height: 52px; border-radius: 999px; display: block; flex-shrink: 0; object-fit: cover; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3px #DCE0DA, 0 4px 12px rgba(20,32,28,0.12)">
<h1 style="margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 800; color: #14201C; text-transform: uppercase">Niveau 4C</h1>
</div>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #55625D; max-width: 580px; text-wrap: pretty">Les types d’arrêts et les signes conventionnels&nbsp;: apprends-les avec les fiches, puis révise-les en QCM, en vrai ou faux et en texte à trous.</p>
</div>
<section aria-labelledby="h-types" style="background: #FFFFFF; border: 1px solid #DCE0DA; border-radius: 24px; padding: 24px 22px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 20px">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 440px">
<span :style="`font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: ${accent}`">Chapitre 11</span>
<h2 id="h-types" style="margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 800">Les types d’arrêts</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #55625D; text-wrap: pretty">Complet, suffisant, correct ou mauvais&nbsp;: savoir où l’on peut s’arrêter, et quoi faire ensuite.</p>
</div>
<span dir="rtl" lang="ar" aria-hidden="true" :style="`font-family: 'Hafs', 'Amiri', serif; font-weight: 400; font-size: 26px; line-height: 1.7; color: ${accent}`">اَلۡوَقۡفُ وَ الۡإِبۡتِدَاءُ</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 10px">
<button class="lift" @click="goTypes" :style="`text-align: left; background: ${accent}; color: #FFFFFF; border: 1.5px solid ${accent}; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px`">
<span style="width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 1 3 17V5.5Z"></path><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h6A1.5 1.5 0 0 0 21 17V5.5Z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Fiches</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; opacity: 0.92">4 types · tableau comparatif</span></span>
</button>
<button class="lift" @click="startTQcm" style="text-align: left; background: #FFFFFF; border: 1.5px solid #DCE0DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px">
<span :style="`width: 38px; height: 38px; border-radius: 11px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center`"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="6" r="2"></circle><path d="M11 6h9"></path><circle cx="5.5" cy="12" r="2"></circle><path d="M11 12h9"></path><circle cx="5.5" cy="18" r="2"></circle><path d="M11 18h9"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">QCM</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: #55625D">{{metaT.qcm}}</span></span>
</button>
<button class="lift" @click="startTVf" style="text-align: left; background: #FFFFFF; border: 1.5px solid #DCE0DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px">
<span :style="`width: 38px; height: 38px; border-radius: 11px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center`"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12.5l3.2 3.2L11 9.5"></path><path d="M15 9l6 6M21 9l-6 6"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Vrai ou faux</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: #55625D">{{metaT.vf}}</span></span>
</button>
<button class="lift" @click="startTTrous" style="text-align: left; background: #FFFFFF; border: 1.5px solid #DCE0DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px">
<span :style="`width: 38px; height: 38px; border-radius: 11px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center`"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h6"></path><rect x="11" y="5.5" width="10" height="5" rx="1.5" stroke-dasharray="2 2"></rect><path d="M3 16h3"></path><rect x="8" y="13.5" width="8" height="5" rx="1.5" stroke-dasharray="2 2"></rect><path d="M18 16h3"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Texte à trous</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: #55625D">{{metaT.trous}}</span></span>
</button>
</div>
</section>
<section aria-labelledby="h-signes" style="background: #FFFFFF; border: 1px solid #DCE0DA; border-radius: 24px; padding: 24px 22px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 20px">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 440px">
<span :style="`font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: ${accent}`">Chapitre 15</span>
<h2 id="h-signes" style="margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 800">Les signes conventionnels</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #55625D; text-wrap: pretty">Les 10 signes des arrêts, leur règle de liaison et leur signal visuel.</p>
</div>
<span dir="rtl" lang="ar" :style="`font-family: 'Hafs', 'Amiri', serif; font-weight: 400; font-size: 26px; line-height: 1.7; color: ${accent}`">اَلۡعَلَامَاتُ الِاصۡطِلَاحِيَّةُ</span>
</div>
<div aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 8px">
<template v-for="t in strip">
<span style="width: 56px; height: 56px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE0DA; box-shadow: inset 0 -3px 0 #ECEEE9; display: flex; align-items: center; justify-content: center">
<template v-if="t.isTxt"><span dir="rtl" lang="ar" :style="`font-family: 'Hafs', 'Amiri', 'Noto Naskh Arabic', serif; line-height: 1.3; font-size: ${t.fs}; color: ${t.color}`">{{t.glyph}}</span></template>
<template v-if="t.isSajda"><img src="assets/sajda.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isHizb"><img src="assets/hizb.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isQala"><img src="assets/qala.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isSala"><img src="assets/sala.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isAyah"><img src="assets/fin-de-verset.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isMim"><img src="assets/mim.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isSin"><img src="assets/sin.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isJim"><img src="assets/jim.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isLa"><img src="assets/la.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
<template v-if="t.isDots"><img src="assets/dots.svg" alt="" :style="`width: ${t.px}; height: ${t.px}; display: block`"></template>
</span>
</template>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 10px">
<button class="lift" @click="goLearn" :style="`text-align: left; background: ${accent}; color: #FFFFFF; border: 1.5px solid ${accent}; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px`">
<span style="width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C3 4.7 3.7 4 4.5 4H10a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 1 3 17V5.5Z"></path><path d="M21 5.5c0-.8-.7-1.5-1.5-1.5H14a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5h6A1.5 1.5 0 0 0 21 17V5.5Z"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Fiches</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; opacity: 0.92">10 signes · mode mémorisation</span></span>
</button>
<button class="lift" @click="startQcm" style="text-align: left; background: #FFFFFF; border: 1.5px solid #DCE0DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px">
<span :style="`width: 38px; height: 38px; border-radius: 11px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center`"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="6" r="2"></circle><path d="M11 6h9"></path><circle cx="5.5" cy="12" r="2"></circle><path d="M11 12h9"></path><circle cx="5.5" cy="18" r="2"></circle><path d="M11 18h9"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">QCM</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: #55625D">{{meta.qcm}}</span></span>
</button>
<button class="lift" @click="startVf" style="text-align: left; background: #FFFFFF; border: 1.5px solid #DCE0DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px">

</button>
<button class="lift" @click="startTrous" style="text-align: left; background: #FFFFFF; border: 1.5px solid #DCE0DA; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 122px">
<span :style="`width: 38px; height: 38px; border-radius: 11px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center`"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h6"></path><rect x="11" y="5.5" width="10" height="5" rx="1.5" stroke-dasharray="2 2"></rect><path d="M3 16h3"></path><rect x="8" y="13.5" width="8" height="5" rx="1.5" stroke-dasharray="2 2"></rect><path d="M18 16h3"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">Texte à trous</span><span style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: #55625D">{{meta.trous}}</span></span>
</button>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 12px">

<span :style="`width: 44px; height: 44px; border-radius: 13px; background: ${tint}; color: ${accent}; display: flex; align-items: center; justify-content: center; flex-shrink: 0`"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Installer l’application</span><span style="font-size: 13px; font-weight: 600; color: #55625D">Ordinateur, iPhone et Android</span></span>

<template v-if="isLearn">
<section class="rise" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 460px">
<span dir="rtl" lang="ar" :style="`align-self: flex-start; font-family: 'Hafs', 'Amiri Quran', 'Amiri', serif; font-size: 24px; line-height: 1.7; color: ${accent}`">اَلۡعَلَامَاتُ الِاصۡطِلَاحِيَّةُ</span>
<h1 style="margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -0.025em; font-weight: 800">Les 10 signes</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #55625D">Active le mode mémorisation pour cacher les réponses et te tester signe par signe.</p>
</div>
<label style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border: 1.5px solid #DCE0DA; border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">

Mode mémorisation

<script>
const PROPS = { accent: '#0B5D4B', questions: 10 };
let render = function () {};
class DCLogic {
  constructor() { this.props = PROPS; this.state = null; }
  setState(patch) { this.state = Object.assign({}, this.state || {}, typeof patch === 'function' ? patch(this.state) : patch); render(); }
  forceUpdate() { render(); }
}
class Component extends DCLogic {
  D() {
    if (this._d) return this._d;
    const fr = (t) => String(t).replace(/ ([:;?!»])/g, '\u00a0$1').replace(/« /g, '«\u00a0');
    const signs = [
      { id: 'mim', glyph: 'مـ', nom: 'Mîm', aria: 'Signe de l’arrêt obligatoire', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt obligatoire', liaison: 'Interdite', signal: 'stop', note: '' },
      { id: 'sin', glyph: 'س', nom: 'Sîn', aria: 'Signe de l’arrêt obligatoire en 4 cas', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt obligatoire (4 cas)', liaison: 'Interdite (4 cas) · Autorisée (2 cas)', signal: null, note: 'Pause légère.' },
      { id: 'qala', glyph: 'قلى', nom: 'Qalâ', aria: 'Signe Qalâ', tone: 'red', scale: 0.78, group: 'arret', designation: 'Arrêt prioritaire', liaison: 'Autorisée', signal: 'orange', note: '' },
      { id: 'jim', glyph: 'ج', nom: 'Jîm', aria: 'Signe de l’arrêt autorisé', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt autorisé', liaison: 'Autorisée', signal: 'orange', note: '' },
      { id: 'sala', glyph: 'صلى', nom: 'Salâ', aria: 'Signe Salâ', tone: 'green', scale: 0.78, group: 'arret', designation: 'Arrêt autorisé', liaison: 'Prioritaire', signal: 'orange', note: '' },
      { id: 'la', glyph: 'لا', nom: 'Lâ', aria: 'Signe de l’arrêt interdit', tone: 'green', scale: 1, group: 'arret', designation: 'Arrêt interdit', liaison: 'Obligatoire', signal: 'blue', note: '' },
      { id: 'dots', glyph: '∴ ∴', nom: 'Trois points', aria: 'Paire de trois points', tone: 'green', scale: 0.6, group: 'arret', designation: 'Arrêt autorisé (1 des 2)', liaison: 'Autorisée', signal: 'orange', note: 'Les points vont par paire : on s’arrête à l’un des deux, pas aux deux.' },
      { id: 'sajda', glyph: '۩', nom: '', aria: 'Symbole de prosternation', tone: 'maroon', scale: 0.95, group: 'autre', designation: 'Prosternation', liaison: null, signal: null, note: 'Il est recommandé de se prosterner au niveau de ce symbole. Le mot ou l’expression qui induit la prosternation est marqué(e) d’un trait horizontal au-dessus.' },
      { id: 'hizb', glyph: '۞', nom: '', aria: 'Symbole de fin de section', tone: 'maroon', scale: 0.95, group: 'autre', designation: 'Fin d’une section', liaison: null, signal: null, note: 'Fin d’un Djouz’ (1/30 du Coran), d’un Hizb (1/60), ou d’un Roub’ / Nisf de Hizb (quart et moitié de Hizb).' },
      { id: 'ayah', glyph: '۝١', nom: '', aria: 'Symbole de fin de verset', tone: 'maroon', scale: 0.85, group: 'autre', designation: 'Fin de verset', liaison: null, signal: null, note: 'Le numéro du verset est inscrit dans le symbole.' }
    ].map((s) => Object.assign({}, s, { designation: fr(s.designation), note: fr(s.note), liaison: s.liaison ? fr(s.liaison) : null }));

    const book = {
      mim: { name: 'L’arrêt obligatoire', tr: 'Al-Waqf Al-Lâzim', ar: 'اَلۡوَقۡفُ اللَّازِمُ',
        def: 'C’est l’arrêt qui permet à la phrase d’être complète grammaticalement et du point de vue du sens. Ce type d’arrêt est qualifié de « parfait » car le discours est complet et indépendant de ce qui suit.',
        letter: 'Il est représenté par la lettre Mîm.',
        ex: [{ label: 'Exemple · Sourate 6, verset 36', text: 'إِنَّمَا يَسۡتَجِيبُ ٱلَّذِينَ يَسۡمَعُونَ ۘ وَٱلۡمَوۡتَىٰ يَبۡعَثُهُمُ ٱللَّهُ ثُمَّ إِلَيۡهِ يُرۡجَعُونَ' }] },
      jim: { name: 'L’arrêt permis', tr: 'Al-Waqf Al-Jâiz', ar: 'اَلۡوَقۡفُ الۡجَائِزُ',
        def: 'Il indique un endroit où il est permis soit de s’arrêter soit de continuer sans que l’une de ces deux possibilités soit prioritaire.',
        letter: 'Il est représenté par la lettre Djîm.',
        ex: [{ label: 'Exemple · Sourate 110, verset 3', text: 'وَٱسۡتَغۡفِرۡهُ ۚ إِنَّهُۥ كَانَ تَوَّابًۢا …' }] },
      sala: { name: 'L’arrêt permis avec la préférence de continuer', tr: 'Al-Waqf Al-Jâiz ma’a kaw al-wasl awlâ', ar: 'اَلۡوَقۡفُ الۡجَائِزُ مَعَ كَوۡنِ الۡوَصۡلِ الۡأَوۡلَى',
        def: 'Il indique un endroit où il est permis de s’arrêter ou de continuer, mais la continuation est préférable.',
        letter: 'Il est représenté par la lettre Sôd-lam.',
        ex: [{ label: 'Exemple · Sourate 104, verset 4', text: 'كَلَّا ۖ لَيُنۢبَذَنَّ …' }] },
      qala: { name: 'L’arrêt permis avec la préférence de s’arrêter', tr: 'Al-Waqf Al-Jâiz ma’a kaw Al-Waqf Awlâ', ar: 'اَلۡوَقۡفُ الۡجَائِزُ مَعَ كَوۡنِ الۡوَقۡفِ الۡأَوۡلَى',
        def: 'Il indique un endroit où il est permis de s’arrêter ou de continuer, mais l’arrêt est préférable.',
        letter: 'Il est représenté par les lettres Qôf-lâm.',
        ex: [{ label: 'Exemple · Sourate 61, verset 13', text: '… وَفَتۡحٌ قَرِيبٌ ۗ وَبَشِّرِ ٱلۡمُؤۡمِنِينَ' }] },
      dots: { name: 'L’arrêt lié au suivant', tr: 'Al-Waqf Al-Mouraqqabah', ar: 'اَلۡوَقۡفُ الۡمُرَقَّبَة',
        def: 'Il s’agit de deux endroits où il est possible de s’arrêter, mais on ne peut s’arrêter que sur l’un d’eux seulement.',
        letter: 'Il est représenté par ces 2 fois trois points.',
        ex: [{ label: 'Exemple · Sourate 2, verset 2', text: 'ذَٰلِكَ ٱلۡكِتَٰبُ لَا رَيۡبَ ۛ فِيهِ ۛ هُدًى لِّلۡمُتَّقِينَ' }] },
      la: { name: 'L’arrêt interdit', tr: 'Al-Waqf Al-Mamnoû’', ar: 'اَلۡوَقۡفُ الۡمَمۡنُوعُ',
        def: 'Il indique un endroit où il est défendu de s’arrêter, car, si on le faisait la phrase ne serait pas complète et le sens ne serait pas compréhensible, parce que ce qui précède cet endroit dépend de ce qui le suit grammaticalement et du point de vue du sens.',
        letter: 'Il est représenté par les lettres Lâm-Alif.',
        ex: [{ label: 'Exemple · Sourate 73, verset 20', text: '… وَءَاخَرُونَ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۙ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُ …' }] },
      sin: { name: 'La pause légère', tr: 'As-sakta Al-la ṭîfah', ar: 'اَلسَّكۡتَةُ اللَّطِيفَةُ',
        def: 'C’est l’arrêt sur un mot du Coran, sans reprendre sa respiration, pour un bref instant. Cette pause n’existe qu’à 6 endroits dans la lecture selon le lectionnaire Hafs conformément à Châṭubiyy.',
        letter: 'Il est représenté par la lettre ci-contre. Exemples : 4 obligatoires et 2 autorisés.',
        ex: [
          { label: 'Obligatoire · Sourate 18, verset 1', text: '… وَلَمۡ يَجۡعَل لَّهُۥ عِوَجَا ۜ ۝ قَيِّمًا لِّيُنذِرَ بَأۡسًا شَدِيدًا مِّن لَّدُنۡهُ …' },
          { label: 'Obligatoire · Sourate 36, verset 52', text: '… مِن مَّرۡقَدِنَا ۜ ۗ هَٰذَا …' },
          { label: 'Obligatoire · Sourate 75, verset 27', text: 'وَقِيلَ مَنۡ ۜ رَاقٍ' },
          { label: 'Obligatoire · Sourate 83, verset 14', text: 'كَلَّا ۖ بَلۡ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ' },
          { label: 'Autorisée · Sourate Al-Hâqqah, versets 28 et 29', text: 'مَآ أَغۡنَىٰ عَنِّى مَالِيَهۡ ۜ ۝ هَلَكَ عَنِّى سُلۡطَٰنِيَهۡ' },
          { label: 'Autorisée · Fin d’Al-Anfâl et début d’At-Tawbah', text: '… إِنَّ ٱللَّهَ بِكُلِّ شَىۡءٍ عَلِيمٌۢ ۜ بَرَآءَةٌ مِّنَ ٱللَّهِ وَرَسُولِهِۦٓ …' }
        ],
        note: 'Lorsque le signe de pause légère coïncide avec la fin d’un verset ou avec un signe d’arrêt, le lecteur a le choix entre l’arrêt et la pause légère (d’où l’obligation d’arrêt). C’est le cas des deux premiers versets des exemples.' }
    };
    signs.forEach((s) => {
      const b = book[s.id];
      s.book = b ? { name: fr(b.name), tr: b.tr, ar: b.ar, def: fr(b.def), letter: fr(b.letter), note: b.note ? fr(b.note) : '', ex: b.ex.map((e) => ({ label: fr(e.label), text: e.text })) } : null;
    });
    const map = {};
    signs.forEach((s) => { map[s.id] = s; });

    const qcm = [
      { g: 'mim', p: 'Que signifie ce signe ?', o: ['Arrêt obligatoire', 'Arrêt prioritaire', 'Arrêt autorisé', 'Arrêt interdit'], e: 'Ce signe marque un arrêt obligatoire : la liaison avec la suite est interdite.' },
      { g: 'la', p: 'Que signifie ce signe ?', o: ['Arrêt interdit', 'Arrêt obligatoire', 'Arrêt autorisé', 'Arrêt prioritaire'], e: 'Avec ce signe, l’arrêt est interdit : la liaison est obligatoire.' },
      { g: 'qala', p: 'Que signifie ce signe ?', o: ['Arrêt prioritaire', 'Arrêt autorisé', 'Arrêt obligatoire', 'Arrêt interdit'], e: 'Avec Qalâ, l’arrêt est prioritaire, mais la liaison reste autorisée.' },
      { g: 'sala', p: 'Avec ce signe, quelle est la règle de liaison ?', o: ['Prioritaire', 'Autorisée', 'Interdite', 'Obligatoire'], e: 'Avec Salâ, l’arrêt est autorisé, mais c’est la liaison qui est prioritaire.' },
      { g: 'jim', p: 'Avec ce signe, quelle est la règle de liaison ?', o: ['Autorisée', 'Prioritaire', 'Interdite', 'Obligatoire'], e: 'Avec ce signe, on peut s’arrêter comme on peut lier : les deux sont autorisés.' },
      { g: null, go: true, p: 'Quel signe indique un arrêt prioritaire ?', o: ['qala', 'sala', 'jim', 'la'], e: 'C’est Qalâ. Ne le confonds pas avec Salâ, où c’est la liaison qui est prioritaire.' },

    ].map((q) => Object.assign({}, q, { p: fr(q.p), e: fr(q.e), o: q.o.map(fr) }));

    const tvf = [
      { s: 'Al-Waqf est un court arrêt à la fin d’un mot, avec l’intention de poursuivre la lecture.', a: true, e: 'C’est la définition d’Al-Waqf.' },

      { s: 'Avec l’arrêt suffisant, les deux phrases sont liées grammaticalement.', a: false, e: 'Les deux phrases n’ont aucun lien grammatical ; elles sont seulement liées dans le sens global.' },

      { s: 'L’arrêt correct est lié à ce qui suit, grammaticalement et par le sens.', a: true, e: 'Son sens est pourtant complet.' },
      { v: 's1v2a', s: 'S’arrêter sur cette expression est un arrêt correct.', a: true, e: 'Sourate 1, verset 2 : c’est l’exemple de l’arrêt correct.' },
      { v: 's1v2b', s: 'S’arrêter sur ce mot est un arrêt suffisant.', a: false, e: 'Le sens n’est pas complet : c’est un mauvais arrêt.' },
      { s: 'Le mauvais arrêt porte sur une phrase dont le sens est complet.', a: false, e: 'Son sens n’est pas complet : il est lié à la suite dans le sens et au niveau grammatical.' },
      { s: 'Le mauvais arrêt est permis si l’on n’a plus de souffle.', a: true, e: 'On doit alors reprendre ce qui a déjà été lu.' },
      { s: 'Après un mauvais arrêt, on continue avec le mot suivant.', a: false, e: 'On doit reprendre ce qui a déjà été lu.' },
      { s: 'Al-Waqf Al-Qabîh désigne l’arrêt correct.', a: false, e: 'Al-Qabîh désigne le mauvais arrêt ; l’arrêt correct se dit Al-Waqf Al-hasan.' },
      { s: 'Al-Waqf At-tâmm désigne l’arrêt complet.', a: true, e: 'At-tâmm : complet.' }
    ].map((v) => Object.assign({}, v, { s: fr(v.s), e: fr(v.e) }));

    const ttrous = [
      { t: 'Al-Waqf est un court [arrêt] à la fin d’un [mot], avec l’intention de poursuivre la lecture.', d: ['souffle', 'verset'], e: 'On ne peut donc pas s’arrêter à n’importe quel moment.' },
      { t: 'L’arrêt [complet] porte sur une phrase compréhensive, qui n’est pas [grammaticalement] liée à ce qui suit.', d: ['correct', 'phonétiquement'], e: 'Pour la lecture, il suffit de passer à la phrase suivante.' },
      { t: 'L’arrêt [suffisant] porte sur une phrase au sens complet, liée à la suite dans le sens [global], sans lien grammatical.', d: ['mauvais', 'littéral'], e: 'C’est Al-Waqf Al-Kâfî.' },
      { t: 'Après un arrêt suffisant, on [continue] la lecture sans [reprendre] ce qui a été lu.', d: ['interrompt', 'prononcer'], e: 'Rien n’est à reprendre, contrairement au mauvais arrêt.' },
      { t: 'L’arrêt [correct] porte sur une phrase au sens complet, mais liée à la suite grammaticalement et [sémantiquement].', d: ['complet', 'phonétiquement'], e: 'C’est Al-Waqf Al-hasan.' },
      { t: 'Le [mauvais] arrêt n’est permis que si l’on n’a plus de [souffle].', d: ['correct', 'temps'], e: 'On doit alors reprendre ce qui a déjà été lu.' },
      { t: 'Après un mauvais arrêt, on doit [reprendre] ce qui a déjà été [lu].', d: ['sauter', 'écrit'], e: 'Car le sens de la phrase n’était pas complet.' },
      { t: 'L’arrêt complet se dit Al-Waqf [At-tâmm], et l’arrêt suffisant Al-Waqf [Al-Kâfî].', d: ['Al-hasan', 'Al-Qabîh'], e: 'L’arrêt correct : Al-hasan. Le mauvais arrêt : Al-Qabîh.' },
      { t: 'S’arrêter sur {hamd} (sourate 1, verset 2) est un [mauvais] arrêt : le sens n’est pas [complet].', d: ['bon', 'long'], e: 'S’arrêter sur l’expression entière ٱلۡحَمۡدُ لِلَّهِ est un arrêt correct.' },
      { t: 'S’arrêter sur {hamdl} (sourate 1, verset 2) est un arrêt [correct].', d: ['mauvais', 'complet'], e: 'Le sens est complet, mais il reste lié à la suite.' },
      { t: 'Quitter le verset 5 pour le verset 6 de la sourate 2 est un arrêt [complet].', d: ['mauvais', 'correct'], e: 'Ces 2 versets n’ont pas de rapport (sémantique comme grammatical).' },
      { t: 'Quitter le verset 6 pour le verset 7 de la sourate 2 est un arrêt [suffisant].', d: ['complet', 'mauvais'], e: 'Les deux phrases sont liées dans le sens global, sans lien grammatical.' }
    ].map((x) => ({ t: fr(x.t), d: x.d, e: fr(x.e) }));

    this._d = { fr, signs, map, qcm, vf, trous, EX, AR, types, tqcm, tvf, ttrous };
    return this._d;
  }

  S() {
    return Object.assign({
      screen: 'home', mode: null, topic: 'signes', queue: [], idx: 0, answered: false, picked: null,
      fills: [], checked: false, score: 0, mistakes: [],
      best: { qcm: null, vf: null, trous: null, tqcm: null, tvf: null, ttrous: null }, hide: false, revealed: {}
    }, this.state || {});
  }

  componentDidMount() {
    try {
      const raw = window.localStorage.getItem('waqf-signes-best');
      if (raw) this.setState({ best: Object.assign({ qcm: null, vf: null, trous: null, tqcm: null, tvf: null, ttrous: null }, JSON.parse(raw)) });
    } catch (e) {}
  }

  save(best) {
    try { window.localStorage.setItem('waqf-signes-best', JSON.stringify(best)); } catch (e) {}
  }

  top() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  count() {
    const v = parseInt(this.props.questions, 10);
    return isNaN(v) ? 10 : Math.max(3, Math.min(20, v));
  }

  shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  rgba(hex, alpha) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
    if (!m) return 'rgba(11,93,75,' + alpha + ')';
    const n = parseInt(m[1], 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  tile(id, base) {
    const s = this.D().map[id];
    const tones = { red: '#A1262B', green: '#1D6B3C', maroon: '#7A2430' };
    if (!s) return { glyph: '', color: '#14201C', fs: '0px', aria: '', isTxt: false, isSajda: false, isHizb: false, isQala: false, isSala: false, isAyah: false, px: '0px' };
    const isSajda = s.id === 'sajda';
    const isHizb = s.id === 'hizb';
    const isQala = s.id === 'qala';
    const isSala = s.id === 'sala';
    const isAyah = s.id === 'ayah';
    return { glyph: s.glyph, color: tones[s.tone], fs: Math.round(base * (s.scale || 1)) + 'px', aria: s.aria, isTxt: !this.isImg(s.id), isSajda, isHizb, isQala, isSala, isAyah, isMim: s.id === 'mim', isSin: s.id === 'sin', isJim: s.id === 'jim', isLa: s.id === 'la', isDots: s.id === 'dots', px: Math.round(base * 1.15) + 'px' };
  }

  isImg(id) {
    return ['mim', 'sin', 'qala', 'jim', 'sala', 'la', 'dots', 'sajda', 'hizb', 'ayah'].indexOf(id) !== -1;
  }

  parse(t) {
    const segs = [];
    const answers = [];
    const re = /\{(\w+)\}|\[([^\]]+)\]/g;
    let last = 0;
    let m;
    while ((m = re.exec(t))) {
      if (m.index > last) segs.push({ type: 'text', text: t.slice(last, m.index) });
      if (m[1]) segs.push({ type: 'glyph', id: m[1] });
      else { segs.push({ type: 'blank', k: answers.length }); answers.push(m[2]); }
      last = re.lastIndex;
    }
    if (last < t.length) segs.push({ type: 'text', text: t.slice(last) });
    return { segs, answers };
  }

  prep(mode, it) {
    if (mode === 'qcm') {
      const opts = it.o.map((x, i) => ({ text: it.go ? '' : x, sign: it.go ? x : null, correct: i === 0 }));
      return { type: 'qcm', g: it.g, v: it.v || null, p: it.p, e: it.e, options: this.shuffle(opts) };
    }
    if (mode === 'vf') return { type: 'vf', g: it.g, v: it.v || null, p: it.s, answer: it.a, e: it.e };
    const parsed = this.parse(it.t);
    return { type: 'trous', segs: parsed.segs, answers: parsed.answers, bank: this.shuffle(parsed.answers.concat(it.d)), e: it.e };
  }

  optText(o) {
    if (!o.sign) return o.text;
    const sg = this.D().map[o.sign];
    return sg.id === 'qala' || sg.id === 'sala' ? sg.nom : 'le signe ci-contre';
  }

  bankKey(mode, topic) {
    return topic === 'types' ? 't' + mode : mode;
  }

  verse(id) {
    const ex = id ? this.D().EX[id] : null;
    if (!ex) return { isPair: false, isSingle: false, before: '', after: '', text: '', ref: '' };
    return { isPair: !!ex.before, isSingle: !ex.before, before: ex.before || '', after: ex.after || '', text: ex.text || '', ref: ex.ref };
  }

  go(screen) {
    this.setState({ screen });
    this.top();
  }

  start(mode, topic) {
    const D = this.D();
    const tp = topic === 'types' ? 'types' : 'signes';
    const bank = D[this.bankKey(mode, tp)];
    const n = Math.max(1, Math.min(this.count(), bank.length));
    const queue = this.shuffle(bank).slice(0, n).map((it) => this.prep(mode, it));
    this.setState({
      screen: mode, mode, topic: tp, queue, idx: 0, answered: false, picked: null, checked: false,
      score: 0, mistakes: [], fills: queue[0].type === 'trous' ? queue[0].answers.map(() => null) : []
    });
    this.top();
  }

  pickOption(i) {
    const s = this.S();
    if (s.answered) return;
    const q = s.queue[s.idx];
    const ok = q.options[i].correct;
    const right = q.options.find((o) => o.correct);
    this.setState({
      answered: true, picked: i, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: q.g || right.sign, v: q.v, prompt: q.p, answer: this.optText(right), explain: q.e }])
    });
  }

  pickVf(v) {
    const s = this.S();
    if (s.answered) return;
    const q = s.queue[s.idx];
    const ok = v === q.answer;
    this.setState({
      answered: true, picked: v, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: q.g, v: q.v, prompt: q.p, answer: q.answer ? 'Vrai' : 'Faux', explain: q.e }])
    });
  }

  pickChip(ci) {
    const s = this.S();
    if (s.checked || s.fills.indexOf(ci) !== -1) return;
    const k = s.fills.indexOf(null);
    if (k === -1) return;
    const f = s.fills.slice();
    f[k] = ci;
    this.setState({ fills: f });
  }

  clearBlank(k) {
    const s = this.S();
    if (s.checked) return;
    const f = s.fills.slice();
    f[k] = null;
    this.setState({ fills: f });
  }

  resetFills() {
    const s = this.S();
    if (s.checked) return;
    this.setState({ fills: s.fills.map(() => null) });
  }

  check() {
    const s = this.S();
    const q = s.queue[s.idx];
    if (s.checked || !q || s.fills.some((x) => x === null)) return;
    const ok = q.answers.every((a, k) => q.bank[s.fills[k]] === a);
    const map = this.D().map;
    const AR = this.D().AR;
    const ref = (id) => (AR[id] ? AR[id] : id === 'qala' || id === 'sala' ? map[id].nom : 'ci-contre');
    const first = q.segs.find((g) => g.type === 'glyph' && map[g.id]);
    const full = q.segs.map((g, i) => {
      if (g.type === 'text') return g.text;
      if (g.type !== 'glyph') return q.answers[g.k];
      const r = ref(g.id);
      const prev = i > 0 && q.segs[i - 1].type === 'text' ? q.segs[i - 1].text : '';
      return r === 'ci-contre' && !/(signe|symbole|paire)\s*$/.test(prev) ? 'le signe ci-contre' : r;
    }).join('');
    this.setState({
      checked: true, answered: true, score: s.score + (ok ? 1 : 0),
      mistakes: ok ? s.mistakes : s.mistakes.concat([{ g: first ? first.id : null, prompt: full, answer: q.answers.join(' · '), explain: q.e }])
    });
  }

  next() {
    const s = this.S();
    const n = s.idx + 1;
    if (n >= s.queue.length) {
      const best = Object.assign({}, s.best);
      const key = this.bankKey(s.mode, s.topic);
      const prev = best[key];
      const ratio = s.score / s.queue.length;
      if (!prev || ratio > prev.score / prev.total || (ratio === prev.score / prev.total && s.queue.length > prev.total)) {
        best[key] = { score: s.score, total: s.queue.length };
      }
      this.save(best);
      this.setState({ screen: 'result', best });
    } else {
      const nq = s.queue[n];
      this.setState({ idx: n, answered: false, picked: null, checked: false, fills: nq.type === 'trous' ? nq.answers.map(() => null) : [] });
    }
    this.top();
  }

  toggleHide() {
    const s = this.S();
    this.setState({ hide: !s.hide, revealed: {} });
  }

  reveal(id) {
    const s = this.S();
    const r = Object.assign({}, s.revealed);
    r[id] = true;
    this.setState({ revealed: r });
  }

  renderVals() {
    const D = this.D();
    const s = this.S();
    const accent = this.props.accent || '#0B5D4B';
    const tint = this.rgba(accent, 0.1);
    const ROSE = '#B42318';
    const ROSE_T = '#FCEDEB';
    const LINE = '#DCE0DA';
    const WHITE = '#FFFFFF';
    const INK = '#14201C';
    const empty = { glyph: '', color: INK, fs: '0px', aria: '', isTxt: false, isSajda: false, isHizb: false, isQala: false, isSala: false, isAyah: false, px: '0px' };
    const n = this.count();
    const screen = s.screen;
    const isQcm = screen === 'qcm';
    const isVf = screen === 'vf';
    const isTrous = screen === 'trous';
    const inSession = isQcm || isVf || isTrous;
    const labels = { qcm: 'QCM', vf: 'Vrai ou faux', trous: 'Texte à trous' };
    const topicLabels = { signes: 'Signes', types: 'Types d’arrêts' };
    const q = inSession ? s.queue[s.idx] : null;
    const total = s.queue.length || 1;

    const units = { qcm: 'questions', vf: 'affirmations', trous: 'phrases' };
    const metaFor = (m, tp) => {
      const key = this.bankKey(m, tp);
      const b = s.best[key];
      const total = D[key].length;
      const base = total + ' ' + units[m];
      return b ? base + ' · record ' + b.score + '/' + b.total : base;
    };

    const sigLabels = { stop: 'Stop', orange: 'Feu orange', blue: 'Sens obligatoire' };
    const learnRows = [];
    const header = (title) => ({ isHeader: true, isHidden: false, isShown: false, title, tile: empty });
    const card = (sg) => {
      const hidden = s.hide && !s.revealed[sg.id];
      return {
        isHeader: false, isHidden: hidden, isShown: !hidden, title: '',
        tile: this.tile(sg.id, 38), nom: sg.nom, hasNom: !!sg.nom,
        designation: sg.designation, hasLiaison: !!sg.liaison, liaison: sg.liaison || '',
        hasNote: !!sg.note, note: sg.note || '', hasSignal: !!sg.signal,
        isStop: sg.signal === 'stop', isOrange: sg.signal === 'orange', isBlue: sg.signal === 'blue',
        signalLabel: sigLabels[sg.signal] || '', reveal: () => this.reveal(sg.id),
        revealAria: 'Révéler la fiche : ' + sg.aria,
        hasBook: !!sg.book, bookName: sg.book ? sg.book.name : '', bookTr: sg.book ? sg.book.tr : '', bookAr: sg.book ? sg.book.ar : '',
        bookDef: sg.book ? sg.book.def : '', bookLetter: sg.book ? sg.book.letter : '', examples: sg.book ? sg.book.ex : [],
        hasBookNote: !!(sg.book && sg.book.note), bookNote: sg.book ? sg.book.note : '', accent
      };
    };
    learnRows.push(header('Signes d’arrêt'));
    D.signs.filter((x) => x.group === 'arret').forEach((x) => learnRows.push(card(x)));
    learnRows.push(header('Autres symboles'));
    D.signs.filter((x) => x.group === 'autre').forEach((x) => learnRows.push(card(x)));

    const typeRows = D.types.map((ty) => {
      const hidden = s.hide && !s.revealed[ty.id];
      return {
        isHidden: hidden, isShown: !hidden, num: ty.num, name: ty.name, translit: ty.translit, ar: ty.ar,
        def: ty.def, after: ty.after, hasNote: !!ty.note, note: ty.note, exLabel: ty.exLabel,
        hasExNote: !!ty.exNote, exNote: ty.exNote, ex: this.verse(ty.ex), accent, tint,
        reveal: () => this.reveal(ty.id), revealAria: 'Révéler la fiche : ' + ty.name
      };
    });
    const cell = (v) => ({ yes: v, no: !v, label: v ? 'Oui' : 'Non', bg: v ? tint : '#EEF0EC', fg: v ? accent : '#55625D' });
    const matrixRows = D.types.map((ty) => {
      const hid = s.hide && !s.revealed['m_' + ty.id];
      return {
        name: ty.short, translit: ty.translit, isHidden: hid, isShown: !hid,
        cells: [cell(ty.sens), cell(ty.lienSens), cell(ty.lienGram)],
        reveal: () => this.reveal('m_' + ty.id), revealAria: 'Vérifier la ligne : ' + ty.name
      };
    });

    let qc = { hasGlyph: false, tile: empty, kicker: '', text: '', hasVerse: false, verse: this.verse(null) };
    if (q && (isQcm || isVf)) {
      qc = {
        hasGlyph: !!q.g, tile: q.g ? this.tile(q.g, 62) : empty,
        kicker: isQcm ? 'Choisis la bonne réponse' : D.fr('Vrai ou faux ?'),
        text: q.p, hasVerse: !!q.v, verse: this.verse(q.v)
      };
    }

    let qcmOptions = [];
    if (q && isQcm) {
      qcmOptions = q.options.map((o, i) => {
        const isRight = o.correct;
        const isPicked = s.picked === i;
        let border = LINE, bg = WHITE, op = '1', badgeBg = '#F0F2EE', badgeFg = INK;
        if (s.answered) {
          if (isRight) { border = accent; bg = tint; badgeBg = accent; badgeFg = WHITE; }
          else if (isPicked) { border = ROSE; bg = ROSE_T; badgeBg = ROSE; badgeFg = WHITE; }
          else { op = '0.5'; }
        }
        const sg = o.sign ? D.map[o.sign] : null;
        const t = sg ? this.tile(sg.id, 34) : empty;
        const letter = 'ABCD'.charAt(i);
        return {
          letter, text: o.text, isText: !sg, isGlyph: !!sg, isGlyphTxt: !!sg && t.isTxt, isQala: t.isQala, isSala: t.isSala, isMim: t.isMim, isJim: t.isJim, isLa: t.isLa, px: t.px, glyph: t.glyph, color: t.color, fs: t.fs,
          border, bg, op, badgeBg, badgeFg, disabled: s.answered,
          showLetter: !(s.answered && (isRight || isPicked)),
          showCheck: s.answered && isRight, showCross: s.answered && isPicked && !isRight,
          aria: 'Réponse ' + letter + ' : ' + (sg ? sg.aria : o.text),
          pick: () => this.pickOption(i)
        };
      });
    }

    let vfButtons = [];
    if (q && isVf) {
      vfButtons = [true, false].map((v) => {
        const isRight = v === q.answer;
        const isPicked = s.picked === v;
        let border = LINE, bg = WHITE, op = '1', fg = INK;
        if (s.answered) {
          if (isRight) { border = accent; bg = tint; fg = accent; }
          else if (isPicked) { border = ROSE; bg = ROSE_T; fg = ROSE; }
          else { op = '0.5'; }
        }
        return { label: v ? 'Vrai' : 'Faux', isTrue: v, isFalse: !v, border, bg, op, fg, disabled: s.answered, pick: () => this.pickVf(v) };
      });
    }

    let tr = { segs: [], chips: [], showActions: false, checkDisabled: true, checkOp: '0.45' };
    if (q && isTrous) {
      const segs = q.segs.map((g) => {
        if (g.type === 'text') return { isText: true, isGlyph: false, isBlank: false, text: g.text };
        if (g.type === 'glyph' && D.AR[g.id]) {
          return { isText: false, isGlyph: true, isGlyphTxt: true, isSajda: false, isHizb: false, isQala: false, isSala: false, isAyah: false, isBlank: false, glyph: D.AR[g.id], color: INK, fs: '1.15em', px: '0px' };
        }
        if (g.type === 'glyph') {
          const t = this.tile(g.id, 30);
          return { isText: false, isGlyph: true, isGlyphTxt: t.isTxt, isSajda: t.isSajda, isHizb: t.isHizb, isQala: t.isQala, isSala: t.isSala, isAyah: t.isAyah, isMim: t.isMim, isSin: t.isSin, isJim: t.isJim, isLa: t.isLa, isDots: t.isDots, isBlank: false, glyph: t.glyph, color: t.color, fs: t.fs, px: t.px };
        }
        const ci = s.fills[g.k];
        const filled = ci !== null && ci !== undefined;
        const word = filled ? q.bank[ci] : '';
        let border = '#9AA59F', bg = '#F6F7F3', fg = INK, bs = 'dashed';
        if (filled) { border = accent; bg = tint; bs = 'solid'; }
        if (s.checked) {
          const ok = word === q.answers[g.k];
          border = ok ? accent : ROSE; bg = ok ? tint : ROSE_T; fg = ok ? accent : ROSE; bs = 'solid';
        }
        return {
          isText: false, isGlyph: false, isBlank: true,
          label: filled ? word : '…', minw: filled ? '0px' : '6.5em', border, bg, fg, bs,
          disabled: s.checked || !filled,
          aria: filled ? 'Retirer le mot ' + word + ' du trou ' + (g.k + 1) : 'Trou ' + (g.k + 1) + ', vide',
          clear: () => this.clearBlank(g.k)
        };
      });
      const chips = q.bank.map((w, ci) => {
        const used = s.fills.indexOf(ci) !== -1;
        return { label: w, disabled: used || s.checked, op: used ? '0.3' : (s.checked ? '0.55' : '1'), pick: () => this.pickChip(ci) };
      });
      const complete = s.fills.length > 0 && s.fills.every((x) => x !== null);
      tr = { segs, chips, showActions: !s.checked, checkDisabled: !complete, checkOp: complete ? '1' : '0.45' };
    }

    let fb = { show: false, ok: false, ko: false, title: '', explain: '', hasExtra: false, extra: '', bg: WHITE, border: LINE, color: accent, nextLabel: '' };
    if (q && s.answered) {
      let ok = false;
      let extra = '';
      if (isQcm) {
        const o = q.options[s.picked];
        ok = !!(o && o.correct);
        if (!ok) { const r = q.options.find((x) => x.correct); extra = r.sign ? 'La bonne réponse est cochée ci-dessus.' : 'Bonne réponse : ' + this.optText(r); }
      } else if (isVf) {
        ok = s.picked === q.answer;
        if (!ok) extra = 'C’est ' + (q.answer ? 'vrai' : 'faux') + '.';
      } else if (isTrous) {
        ok = q.answers.every((a, k) => q.bank[s.fills[k]] === a);
        if (!ok) extra = 'Réponses attendues : ' + q.answers.join(' · ');
      }
      fb = {
        show: true, ok, ko: !ok, title: ok ? 'Bonne réponse' : 'Pas tout à fait',
        explain: q.e, hasExtra: !!extra, extra: D.fr(extra),
        bg: ok ? tint : ROSE_T, border: ok ? this.rgba(accent, 0.35) : 'rgba(180,35,24,0.3)',
        color: ok ? accent : ROSE,
        nextLabel: s.idx + 1 >= s.queue.length ? 'Voir le résultat' : 'Question suivante'
      };
    }

    let res = { modeLabel: '', score: 0, total: 0, barW: '0%', message: '', hasMistakes: false, mistakes: [] };
    if (screen === 'result') {
      const pct = Math.round((s.score / total) * 100);
      let message = 'Reprends les fiches tranquillement, puis réessaie.';
      if (pct === 100) message = 'Sans faute. Les signes sont acquis.';
      else if (pct >= 80) message = 'Très bien. Encore un tour pour les rendre automatiques.';
      else if (pct >= 50) message = 'C’est en bonne voie. Relis les points à revoir, puis recommence.';
      res = {
        modeLabel: (labels[s.mode] || '') + ' · ' + (topicLabels[s.topic] || ''), score: s.score, total: s.queue.length, barW: pct + '%',
        message: D.fr(message), hasMistakes: s.mistakes.length > 0,
        mistakes: s.mistakes.map((m) => ({
          hasTile: !!m.g, tile: m.g ? this.tile(m.g, 28) : empty, hasVerse: !!m.v, verse: this.verse(m.v),
          prompt: m.prompt, answer: m.answer, explain: m.explain, accent
        }))
      };
    }

    const doneCount = s.idx + (s.answered ? 1 : 0);
    const progressNum = inSession ? Math.round((doneCount / total) * 100) : 0;

    return {
      accent, tint,
      isHome: screen === 'home', isLearn: screen === 'learn', isLearnTypes: screen === 'learnTypes', isInstall: screen === 'install', isAbout: screen === 'about',
      showQuit: inSession || screen === 'learn' || screen === 'learnTypes' || screen === 'install' || screen === 'about', isQcm, isVf, isTrous,
      isCard: isQcm || isVf, isResult: screen === 'result', inSession,
      modeLabel: (labels[screen] || '') + (inSession ? ' · ' + (topicLabels[s.topic] || '') : ''), qNum: s.idx + 1, total: s.queue.length, score: s.score,
      progressNum, progressPct: progressNum + '%',
      strip: D.signs.map((x) => this.tile(x.id, 30)),
      meta: { qcm: metaFor('qcm', 'signes'), vf: metaFor('vf', 'signes'), trous: metaFor('trous', 'signes') },
      metaT: { qcm: metaFor('qcm', 'types'), vf: metaFor('vf', 'types'), trous: metaFor('trous', 'types') },
      typeRows, matrixRows,
      learnRows, hide: s.hide, toggleHide: () => this.toggleHide(),
      qc, qcmOptions, vfButtons, tr, fb, res,
      goHome: () => this.go('home'), goLearn: () => this.go('learn'), goTypes: () => this.go('learnTypes'), goInstall: () => this.go('install'), goAbout: () => this.go('about'), quit: () => this.go('home'),
      goFiches: () => this.go(s.topic === 'types' ? 'learnTypes' : 'learn'),
      startQcm: () => this.start('qcm', 'signes'), startVf: () => this.start('vf', 'signes'), startTrous: () => this.start('trous', 'signes'),
      startTQcm: () => this.start('qcm', 'types'), startTVf: () => this.start('vf', 'types'), startTTrous: () => this.start('trous', 'types'),
      restart: () => this.start(s.mode || 'qcm', s.topic),
      next: () => this.next(), check: () => this.check(), resetFills: () => this.resetFills()
    };
  }
}
const comp = new Component();
const store = PetiteVue.reactive(Object.assign({}, comp.renderVals()));
render = function () { Object.assign(store, comp.renderVals()); };
PetiteVue.createApp(store).mount('#app');
if (comp.componentDidMount) comp.componentDidMount();

// Bouton « retour » du téléphone : revenir à l’accueil au lieu de quitter l’application
(function () {
  const go = comp.go.bind(comp), start = comp.start.bind(comp);
  let fromPop = false;
  try { history.replaceState({ s: 'home' }, ''); } catch (e) {}
  comp.go = function (s) {
    go(s);
    if (fromPop) return;
    try { if (s === 'home') history.replaceState({ s: 'home' }, ''); else history.pushState({ s: s }, ''); } catch (e) {}
  };
  comp.start = function (m, t) { start(m, t); try { history.pushState({ s: m }, ''); } catch (e) {} };
  window.addEventListener('popstate', function () { fromPop = true; go('home'); fromPop = false; });
})();

// Mode hors ligne, installation sur l’écran d’accueil et message de mise à jour
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    const banner = document.getElementById('update-banner');
    let accepted = false;
    function showBanner(worker) {
      banner.style.display = 'flex';
      document.getElementById('update-now').onclick = function () {
        accepted = true;
        document.getElementById('update-now').textContent = 'Mise à jour…';
        worker.postMessage({ type: 'SKIP_WAITING' });
      };
      document.getElementById('update-later').onclick = function () { banner.style.display = 'none'; };
    }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (accepted) window.location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) showBanner(reg.waiting);
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showBanner(nw);
        });
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
</script>
