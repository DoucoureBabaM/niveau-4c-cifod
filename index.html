<section aria-labelledby="h-arbre8" style="background: var(--surface2); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px"><h2 id="h-arbre8" style="margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800">Résumé&nbsp;: l’arbre des assimilations</h2><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9; color: var(--accent)">ٱلۡإِدۡغَامُ</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 0"><span style="font-size: 16px; font-weight: 800; color: #FFFFFF; background: var(--accent); padding: 6px 22px; border-radius: 999px">Idghâm</span><span aria-hidden="true" style="width: 2px; height: 16px; background: var(--line2)"></span><span aria-hidden="true" style="width: 70%; height: 2px; background: var(--line2)"></span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 12px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--accent)"><span style="align-self: flex-start; font-size: 15px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--surface3)">1. Idghâm al-Moutamâthilayn</span><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Si <strong>2 lettres identiques</strong> se suivent, la 1<sup>re</sup> étant neutre et la 2<sup>e</sup> vocalisée, elles fusionnent <strong>sans nasillement</strong>.</p><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span></span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">إِ<span style="color: var(--red)">ذ ذَّ</span>هَبَ</span></div><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span></span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">وَقَ‍<span style="color: var(--red)">‍د دَّ</span>خَلُواْ</span></div><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Pour les lettres <strong>Mîm (<span style="font-size: 22px; font-weight: 800">م</span>) et Noûn (<span style="font-size: 22px; font-weight: 800">ن</span>)</strong>, un nasillement de 2 temps est <strong>obligatoire</strong>.</p><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span style="font-size: 12.5px; font-weight: 700; color: var(--muted)">Idghâm bi ghunna</span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">مِّ‍<span style="color: var(--red)">‍ن نَّ‍</span>‍خِيلٖ</span></div><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span style="font-size: 12.5px; font-weight: 700; color: var(--muted)">Idghâm chafawy</span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">وَءَامَنَهُ‍<span style="color: var(--red)">‍م مِّ‍</span>‍نۡ خَوۡفِۭ</span></div></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--green)"><span style="align-self: flex-start; font-size: 15px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--surface3)">2. Idghâm al-Moutadjânissayn</span><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">C’est la rencontre de <strong>2 lettres affinitaires</strong> (qui ont des affinités) : elles ont le <strong>même point de sortie</strong> mais des <strong>attributs différents</strong>. Il y a fusion de la 1<sup>re</sup> lettre dans la 2<sup>e</sup>.</p><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Il y a <strong>7 cas</strong> possibles dans le Qur’ân :</p><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.5"><li>Dâl (<span style="font-size: 22px; font-weight: 800">د</span>) dans Tâ (<span style="font-size: 22px; font-weight: 800">ت</span>)</li><li>Tâ (<span style="font-size: 22px; font-weight: 800">ت</span>) dans Dâl (<span style="font-size: 22px; font-weight: 800">د</span>)</li><li>Tâ (<span style="font-size: 22px; font-weight: 800">ت</span>) dans Ṯô (<span style="font-size: 22px; font-weight: 800">ط</span>)</li><li>Ṯô (<span style="font-size: 22px; font-weight: 800">ط</span>) dans Tâ (<span style="font-size: 22px; font-weight: 800">ت</span>) — <strong>fusion partielle</strong></li><li>Dzâl (<span style="font-size: 22px; font-weight: 800">ذ</span>) dans Ẕô (<span style="font-size: 22px; font-weight: 800">ظ</span>)</li><li>Thâ (<span style="font-size: 22px; font-weight: 800">ث</span>) dans Dzâl (<span style="font-size: 22px; font-weight: 800">ذ</span>)</li><li>Bâ (<span style="font-size: 22px; font-weight: 800">ب</span>) dans Mîm (<span style="font-size: 22px; font-weight: 800">م</span>)</li></ul></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); border-top: 5px solid var(--amber-fg)"><span style="align-self: flex-start; font-size: 15px; font-weight: 800; padding: 4px 12px; border-radius: 999px; background: var(--surface3)">3. Idghâm al-Moutaqâribayn</span><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">C’est la rencontre de 2 lettres, la 1<sup>re</sup> étant neutre et la 2<sup>e</sup> vocalisée, dont les <strong>points de sortie</strong> et les <strong>attributs</strong> sont <strong>proches</strong>. Il y a fusion de la 1<sup>re</sup> dans la 2<sup>e</sup>.</p><p style="margin: 0; font-size: 14.5px; line-height: 1.55; text-wrap: pretty">Il y a <strong>2 cas</strong> dans le Qur’ân :</p><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span style="font-size: 12.5px; font-weight: 700; color: var(--muted)">Lâm (<span style="font-size: 22px; font-weight: 800">ل</span>) dans Rô (<span style="font-size: 22px; font-weight: 800">ر</span>)</span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">وَقُ‍<span style="color: var(--red)">‍ل رَّ</span>بِّ</span></div><div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 10px; padding: 4px 10px; border-radius: 10px; background: var(--surface2)"><span style="font-size: 12.5px; font-weight: 700; color: var(--muted)">Qôf (<span style="font-size: 22px; font-weight: 800">ق</span>) dans Kâf (<span style="font-size: 22px; font-weight: 800">ك</span>)</span><span dir="rtl" lang="ar" style="font-family: 'ArPunct', var(--arfont, 'Hafs'), 'Hafs', 'Amiri Quran', serif; font-size: calc(21px * var(--ar, 1)); line-height: 1.9">أَلَمۡ نَخۡلُ‍<span style="color: var(--red)">‍قكُّ‍</span>‍م</span></div></div>
</div>

<script>
const PROPS = { accent: '#0B5D4B', questions: 10 };
let render = function () {};
class DCLogic {
  constructor() { this.props = PROPS; this.state = null; }
  setState(patch) { this.state = Object.assign({}, this.state || {}, typeof patch === 'function' ? patch(this.state) : patch); render(); }
  forceUpdate() { render(); }
}
class Component extends DCLogic {
  D() {
    if (this._d) return this._d;
    const fr = (t) => String(t).replace(/ ([:;?!»])/g, '\u00a0$1').replace(/« /g, '«\u00a0');
    const signs = [
      { id: 'mim', glyph: 'مـ', nom: 'Mîm', aria: 'Signe de l’arrêt obligatoire', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt obligatoire', liaison: 'Interdite', signal: 'stop', note: '' },
      { id: 'sin', glyph: 'س', nom: 'Sîn', aria: 'Signe de l’arrêt obligatoire en 4 cas', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt obligatoire (4 cas)', liaison: 'Interdite (4 cas) · Autorisée (2 cas)', signal: null, note: 'Pause légère.' },
      { id: 'qala', glyph: 'قلى', nom: 'Qalâ', aria: 'Signe Qalâ', tone: 'red', scale: 0.78, group: 'arret', designation: 'Arrêt prioritaire', liaison: 'Autorisée', signal: 'orange', note: '' },
      { id: 'jim', glyph: 'ج', nom: 'Jîm', aria: 'Signe de l’arrêt autorisé', tone: 'red', scale: 1, group: 'arret', designation: 'Arrêt autorisé', liaison: 'Autorisée', signal: 'orange', note: '' },
      { id: 'sala', glyph: 'صلى', nom: 'Salâ', aria: 'Signe Salâ', tone: 'green', scale: 0.78, group: 'arret', designation: 'Arrêt autorisé', liaison: 'Prioritaire', signal: 'orange', note: '' },
      { id: 'la', glyph: 'لا', nom: 'Lâ', aria: 'Signe de l’arrêt interdit', tone: 'green', scale: 1, group: 'arret', designation: 'Arrêt interdit', liaison: 'Obligatoire', signal: 'blue', note: '' },
      { id: 'dots', glyph: '∴ ∴', nom: 'Trois points', aria: 'Paire de trois points', tone: 'green', scale: 0.6, group: 'arret', designation: 'Arrêt autorisé (1 des 2)', liaison: 'Autorisée', signal: 'orange', note: 'Les points vont par paire : on s’arrête à l’un des deux, pas aux deux.' },
      { id: 'sajda', glyph: '۩', nom: '', aria: 'Symbole de prosternation', tone: 'maroon', scale: 0.95, group: 'autre', designation: 'Prosternation', liaison: null, signal: null, note: 'Il est recommandé de se prosterner au niveau de ce symbole. Le mot ou l’expression qui induit la prosternation est marqué(e) d’un trait horizontal au-dessus.' },
      { id: 'hizb', glyph: '۞', nom: '', aria: 'Symbole de fin de section', tone: 'maroon', scale: 0.95, group: 'autre', designation: 'Fin d’une section', liaison: null, signal: null, note: 'Fin d’un Djouz’ (1/30 du Qur’ân), d’un Hizb (1/60), ou d’un Roub’ / Nisf de Hizb (quart et moitié de Hizb).' },
      { id: 'ayah', glyph: '۝١', nom: '', aria: 'Symbole de fin de verset', tone: 'maroon', scale: 0.85, group: 'autre', designation: 'Fin de verset', liaison: null, signal: null, note: 'Le numéro du verset est inscrit dans le symbole.' }
    ].map((s) => Object.assign({}, s, { designation: fr(s.designation), note: fr(s.note), liaison: s.liaison ? fr(s.liaison) : null }));

    const book = {
      mim: { name: 'L’arrêt obligatoire', tr: 'Al-Waqf Al-Lâzim', ar: 'اَلۡوَقۡفُ اللَّازِمُ',
        def: 'C’est l’arrêt qui permet à la phrase d’être complète grammaticalement et du point de vue du sens. Ce type d’arrêt est qualifié de « parfait » car le discours est complet et indépendant de ce qui suit.',
        letter: 'Il est représenté par la lettre Mîm.',
        ex: [{ label: 'Exemple · Sourate 6, verset 36', text: 'إِنَّمَا يَسۡتَجِيبُ ٱلَّذِينَ يَسۡمَعُونَ ۘ وَٱلۡمَوۡتَىٰ يَبۡعَثُهُمُ ٱللَّهُ ثُمَّ إِلَيۡهِ يُرۡجَعُونَ' }] },
      jim: { name: 'L’arrêt permis', tr: 'Al-Waqf Al-Jâiz', ar: 'اَلۡوَقۡفُ الۡجَائِزُ',
        def: 'Il indique un endroit où il est permis soit de s’arrêter soit de continuer sans que l’une de ces deux possibilités soit prioritaire.',
        letter: 'Il est représenté par la lettre Djîm.',
        ex: [{ label: 'Exemple · Sourate 110, verset 3', text: 'وَٱسۡتَغۡفِرۡهُ ۚ إِنَّهُۥ كَانَ تَوَّابًۢا …' }] },
      sala: { name: 'L’arrêt permis avec la préférence de continuer', tr: 'Al-Waqf Al-Jâiz ma’a kaw al-wasl awlâ', ar: 'اَلۡوَقۡفُ الۡجَائِزُ مَعَ كَوۡنِ الۡوَصۡلِ الۡأَوۡلَى',
        def: 'Il indique un endroit où il est permis de s’arrêter ou de continuer, mais la continuation est préférable.',
        letter: 'Il est représenté par la lettre Sôd-lam.',
        ex: [{ label: 'Exemple · Sourate 104, verset 4', text: 'كَلَّا ۖ لَيُنۢبَذَنَّ …' }] },
      qala: { name: 'L’arrêt permis avec la préférence de s’arrêter', tr: 'Al-Waqf Al-Jâiz ma’a kaw Al-Waqf Awlâ', ar: 'اَلۡوَقۡفُ الۡجَائِزُ مَعَ كَوۡنِ الۡوَقۡفِ الۡأَوۡلَى',
        def: 'Il indique un endroit où il est permis de s’arrêter ou de continuer, mais l’arrêt est préférable.',
        letter: 'Il est représenté par les lettres Qôf-lâm.',
        ex: [{ label: 'Exemple · Sourate 61, verset 13', text: '… وَفَتۡحٌ قَرِيبٌ ۗ وَبَشِّرِ ٱلۡمُؤۡمِنِينَ' }] },
      dots: { name: 'L’arrêt lié au suivant', tr: 'Al-Waqf Al-Mouraqqabah', ar: 'اَلۡوَقۡفُ الۡمُرَقَّبَة',
        def: 'Il s’agit de deux endroits où il est possible de s’arrêter, mais on ne peut s’arrêter que sur l’un d’eux seulement.',
        letter: 'Il est représenté par ces 2 fois trois points.',
        ex: [{ label: 'Exemple · Sourate 2, verset 2', text: 'ذَٰلِكَ ٱلۡكِتَٰبُ لَا رَيۡبَ ۛ فِيهِ ۛ هُدًى لِّلۡمُتَّقِينَ' }] },
      la: { name: 'L’arrêt interdit', tr: 'Al-Waqf Al-Mamnoû’', ar: 'اَلۡوَقۡفُ الۡمَمۡنُوعُ',
        def: 'Il indique un endroit où il est défendu de s’arrêter, car, si on le faisait la phrase ne serait pas complète et le sens ne serait pas compréhensible, parce que ce qui précède cet endroit dépend de ce qui le suit grammaticalement et du point de vue du sens.',
        letter: 'Il est représenté par les lettres Lâm-Alif.',
        ex: [{ label: 'Exemple · Sourate 73, verset 20', text: '… وَءَاخَرُونَ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۙ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُ …' }] },
      sin: { name: 'La pause légère', tr: 'As-sakta Al-la ṭîfah', ar: 'اَلسَّكۡتَةُ اللَّطِيفَةُ',
        def: 'C’est l’arrêt sur un mot du Qur’ân, sans reprendre sa respiration, pour un bref instant. Cette pause n’existe qu’à 6 endroits dans la lecture selon le lectionnaire Hafs conformément à Châṭubiyy.',
        letter: 'Il est représenté par la lettre ci-contre. Exemples : 4 obligatoires et 2 autorisés.',
        ex: [
          { label: 'Sourate 18, verset 1', group: '4 obligatoires', sinShift: { left: '0.3em', top: '-0.18em' }, text: '… وَلَمۡ يَجۡعَل لَّهُۥ عِوَجَا ۜ ١ قَيِّمًا لِّيُنذِرَ بَأۡسًا شَدِيدًا مِّن لَّدُنۡهُ …' },
          { label: 'Sourate 36, verset 52', group: '4 obligatoires', text: '… مِن مَّرۡقَدِنَا ۜ ۗ هَٰذَا …' },
          { label: 'Sourate 75, verset 27', group: '4 obligatoires', sinShift: { left: '0.34em', top: '-0.12em', ws: '-0.2em' }, text: 'وَقِيلَ مَنۡ ۜ رَاقٍ' },
          { label: 'Sourate 83, verset 14', group: '4 obligatoires', sinShift: { left: '0.3em', top: '-0.38em', ws: '-0.2em' }, text: 'كَلَّا ۖ بَلۡ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ' },
          { label: 'Autorisée · Sourate Al-Hâqqah, versets 28 et 29', sinShift: { left: '0.32em', top: '-0.14em' }, text: 'مَآ أَغۡنَىٰ عَنِّى مَالِيَهۡ ۜ ٢٨ هَلَكَ عَنِّى سُلۡطَٰنِيَهۡ' },
          { label: 'Autorisée · Fin d’Al-Anfâl et début d’At-Tawbah', sinShift: { left: '0.3em', top: '-0.2em', ws: '-0.2em' }, text: '… إِنَّ ٱللَّهَ بِكُلِّ شَىۡءٍ عَلِيمۡ ۜ بَرَآءَةٌ مِّنَ ٱللَّهِ وَرَسُولِهِۦٓ …' }
        ],
        note: 'Lorsque le signe de pause légère coïncide avec la fin d’un verset ou avec un signe d’arrêt, le lecteur a le choix entre l’arrêt et la pause légère (d’où l’obligation d’arrêt). C’est le cas des deux premiers versets des exemples.' }
    };

        sections: [
          { num: '1', title: 'Histoire, but et position légale', ar: '', verdict: 'Présentation', chipBg: 'var(--tint2)', chipFg: 'var(--accent)', def: '',
            cases: [
              { rule: '**Histoire** (bref rappel sur les lectionnaires) : il existe environ une dizaine de variations de lectures différentes (Hafs, Warsh, Qôlûn, Ad-Duriy, etc.). Allah, dans Sa grande sagesse et dans Son immense miséricorde, nous a permis d’avoir plusieurs lectures pour plusieurs peuples et tribus, pour des raisons de facilité : le dialecte des Arabes n’était pas le même d’une région à une autre. La lecture Warsh se rapprochait le plus de la récitation du Prophète ﷺ, mais celle de Hafs est la plus répandue dans le monde.', ex: [] },
              { rule: '**La lecture Hafs** : le mot « Hafs » vient de l’imam Hafs Ibn Sulaymân Al-Bazzâz, né à Koufa (Irak) en 90 H / 709 et décédé à 86 ans en 180 H / 795. Il fut l’élève de ’Âsim Ibn Abî An-Najoûd, qui étudia le Qur’ân auprès d’Abou Abderrahmân As-Soulamiy. Celui-ci rapporte sa lecture de cinq illustres Compagnons : ’Othmân Ibn ’Affân, ’Aliy Ibn Abî Tôlib, ’Abdullah Ibn Mas’oûd, Oubay Ibn Ka’b et Zayd Ibn Thâbit. La lecture Hafs existe dans tous les pays musulmans, sauf au Maghreb, en Afrique subsaharienne et au Soudan, où l’on lit Warsh (Maroc, Algérie, Mauritanie, Afrique subsaharienne, est de la Tunisie), Qôlûn (Libye, nord de la Tunisie) et Ad-Duriy (Soudan, Somalie, Tchad, une partie du Yémen).', ex: [] },
              { rule: '**But** : lire le QUR’ÂN de la même façon que le Prophète ﷺ l’avait enseigné, afin de plaire à ALLAH.', ex: [] },

              { rule: '**Champs d’application** : principalement le QUR’ÂN. Selon certains savants, même les hadiths sont concernés. Il est clair que lors de la récitation des invocations prophétiques, on ne doit pas faire de fautes.', ex: [] }
            ] },
          { num: '2', title: 'Les degrés de lecture du QUR’ÂN', ar: '', verdict: '4 degrés', chipBg: 'var(--accent)', chipFg: 'var(--onaccent)', def: 'Il existe quatre degrés de lecture du QUR’ÂN (vitesse) :',
            cases: [
              { rule: '**At-tartîl (ٱلتَّرۡتِيلُ)** : c’est le mode lent et clair de récitation.', ex: [], note: 'NB : At-tartîl est la meilleure façon de réciter, car le QUR’ÂN fut révélé ainsi.' },
              { rule: '**Al-hadr (ٱلۡحَدۡرُ)** : c’est le mode rapide, mais tout en respectant les règles. Il est conseillé lors des révisions.', ex: [] },
              { rule: '**At-tadwîr (ٱلتَّدۡوِيرُ)** : c’est un mode de récitation à mi-chemin entre « Al-hadr » et « At-tartîl ».', ex: [] },
              { rule: '**At-tahqîq (ٱلتَّحۡقِيقُ)** : ce mode est proche du « tartîl », mais il se fait avec une grande précaution et lenteur, à des fins pédagogiques. Il est connu sous le nom d’At-tandjîme en Égypte.', ex: [] }
            ] },
          { num: '3', title: 'La faute dans la lecture (Al-Lahn)', ar: 'ٱللَّحۡنُ', verdict: '2 types de fautes', chipBg: 'var(--amber-bg)', chipFg: 'var(--amber-fg)', def: '**Al-Lahn**, c’est l’erreur dans la lecture du Saint Qur’ân : on dit qu’il y a Al-Lahn lorsque l’on dévie de la justesse dans la récitation. On distingue deux (2) types d’erreurs de récitation :',
            cases: [
              { rule: '**Al-Lahn Al-Djaliyy (ٱللَّحۡنُ ٱلۡجَلِيُّ)** : les fautes graves et évidentes. C’est une erreur considérable qui va en opposition avec les règles essentielles de la langue arabe ; elle peut ou non changer le sens de la phrase. Elle est dite « djaliyy » car elle paraît évidente aussi bien pour les spécialistes d’At-tadjwîd que pour les non-initiés : le changement d’une lettre par une autre, d’une voyelle par une autre, ou le non-respect des caractéristiques (Sifât) des lettres.',
                ex: [{ label: 'Une voyelle par une autre', text: 'ٱلۡحَمۡ[[r:دُ]] ≠ ٱلۡحَمۡ[[r:دَ]]' }, { label: 'Une lettre par une autre', text: 'صِرَٰ[[r:طَ]] ≠ صِرَٰ[[r:تَ]]' }],
                note: 'Ces changements de lettres ou de voyelles constituent un changement de sens voulu ou réel : c’est une faute grave. Les savants ont jugé Al-Lahn Al-Djaliyy illicite, pouvant même conduire à un péché.' },
              { rule: '**Al-Lahn Al-Khafiyy (ٱللَّحۡنُ ٱلۡخَفِيُّ)** : les fautes mineures et subtiles. C’est une faute dite subtile, voire imperceptible, qui n’est pas en opposition avec les règles de la langue arabe et qui ne change pas le sens du mot ou de la phrase ; mais elle est en désaccord avec les règles spécifiques d’At-tadjwîd. Seuls les initiés peuvent la percevoir : par exemple le non-respect du nasillement, des règles d’Al-Qolqolah ou encore de Lafdzoul Djalâlah.',

                note: 'La majorité des savants d’At-tadjwîd jugent Al-Lahn Al-Khafiyy makroûh (détestable). Cependant, d’autres la considèrent comme harâm (interdite), à un degré moindre que la faute grave.' }
            ] },
          { num: '4', title: 'Mérites de la lecture du QUR’ÂN', ar: '', verdict: 'Hadiths', chipBg: 'var(--surface3)', chipFg: 'var(--ink)', def: 'Nombreux sont les hadiths faisant l’éloge des mérites liés à la lecture du Qur’ân : il offre la science, la connaissance, la purification, la sagesse, l’accroissement de la piété, des bonnes actions, l’intercession le jour de la résurrection… Le Prophète ﷺ a dit :',
            cases: [
              { rule: '« Le Qur’ân est un intercesseur agréé et un défenseur véritable. Alors quiconque prend pour guide le Qur’ân, il le mènera au Paradis, et quiconque le délaisse derrière lui, il le poussera dans le feu de l’enfer. » (Ibn Hibbân)', ex: [] },
              { rule: '« Celui qui apprend le Qur’ân par cœur, en observe les décrets permissifs et ceux prohibitifs, Allah le fera entrer au paradis et lui accordera l’intercession en faveur de dix proches parents qui seront voués à l’enfer. » (Tirmidhi)', ex: [] },
              { rule: '« On dira au récitant du Qur’ân : Récite et monte, et psalmodie-le comme tu le faisais dans le bas monde. Ta place sera là où tu auras récité le dernier verset. » (Abû Dâoûd)', ex: [] },
              { rule: '« Quiconque récite une seule lettre du Qur’ân aura une bonne action. La bonne action sera décuplée. Je ne dis pas : Alif Lâm Mîm est une lettre. Plutôt, Alif est une lettre, Lâm est une lettre et Mîm une autre lettre. » (Tirmidhi)', ex: [],

            def: 'On applique cette règle quand la lettre Noûn as-sâkinah ou At-tanwîn est suivi(e) par l’une des six (6) lettres de l’expression [[L:يَرۡمَلُونَ : ي ر م ل و ن]]. Les deux ne formeront qu’une seule lettre avec renforcement (Ach-chaddah) : on parle de fusion ou d’assimilation. Le signe Ach-chaddah n’est pas matérialisé pour les lettres [[L:و]] et [[L:ي]]. L’assimilation peut être de 2 types : avec nasillement et sans nasillement.',
            cases: [
              { rule: '**Avec nasillement [Al-Idghâm bi-ghounnah] (ٱلۡإِدۡغَامُ بِغُنَّةٍ)** : quand l’une des lettres **Mîm (م), Noûn (ن), Wâw (و)** ou **Yâ (ي)** est placée après le Noûn as-sâkinah ou At-tanwîn, il s’ensuit une assimilation avec nasalisation [Al-Ghounnah] du son de la lettre. Devant le Mîm et le Noûn :',
                ex: [{ label: NS(86, 6), text: '… مِ[[r:ن مَّ]]آءٖ …' }, { label: TW(104, 9), text: 'فِي عَمَ[[r:دٖ مُّ]]مَدَّدَةِۭ' }, { label: NS(36, 34), text: '… مِّ[[r:ن نَّ]]خِيلٖ …' }, { label: TW(88, 3), text: 'عَامِلَ[[r:ةٞ نَّ]]اصِبَةٞ' }],
                note: 'Il est important de bien sortir le son du nez (cavité nasale) et non de la langue lors du nasillement [Al-Ghounnah]. Attention à ne pas prononcer tout le mot avec le nez, mais juste la lettre concernée.' },
              { rule: 'Avec nasillement, devant le Wâw et le Yâ : le signe Ach-chaddah n’y est pas matérialisé.',
                ex: [{ label: NS(85, 20), text: '… مِ[[r:ن وَ]]رَآئِهِم …' }, { label: TW(77, 26), text: 'أَحۡيَآ[[r:ءٗ وَ]]أَمۡوَٰتٗا' }, { label: NS(99, 7), text: 'فَمَ[[r:ن يَ]]عۡمَلۡ …' }, { label: TW(76, 6), text: 'عَيۡ[[r:نٗا يَ]]شۡرَبُ …' }] },
              { rule: '**Sans nasillement [Al-Idghâm bilâ ghounnah] (ٱلۡإِدۡغَامُ بِلَا غُنَّةٍ)** : quand les lettres **Rô (ر)** ou **Lâm (ل)** suivent le Noûn as-sâkinah ou At-tanwîn, la lettre Noûn ou le son N du tanwîn disparaît totalement, et la lecture se fait avec renforcement (mouchaddadah) et sans nasillement.',
                ex: [{ label: NS(2, 5), text: '… مِّ[[r:ن رَّ]]بِّهِمۡ …' }, { label: TW(101, 7), text: 'فِي عِيشَ[[r:ةٖ رَّ]]اضِيَةٖ' }, { label: NS(112, 4), text: 'وَلَمۡ يَكُ[[r:ن لَّ]]هُۥ …' }, { label: TW(16, 66), text: '… وَدَ[[r:مٖ لَّ]]بَنًا …' }] },
              { rule: 'Exception : si le Noûn as-sâkinah est suivi par l’une des 6 lettres d’Al-Idghâm dans le même mot, on n’applique pas l’assimilation, mais la clarification [Al-Idz’hâr]. Cela ne se retrouve que dans ces 4 mots du Qur’ân.',
                ex: [{ label: 'ٱلدُّنۡيَا · Sourate 87, verset 16', text: 'بَلۡ تُؤۡثِرُونَ ٱلۡحَيَوٰةَ ٱلدُّ[[r:نۡيَ]]ا' }, { label: 'بُنۡيَٰنٌ · Sourate 61, verset 4', text: '… بُ[[r:نۡيَٰ]]نٞ مَّرۡصُوصٞ' }, { label: 'صِنۡوَانٌ · Sourate 13, verset 4', text: '… صِ[[r:نۡوَ]]انٞ وَغَيۡرُ صِ[[r:نۡوَ]]انٖ …' }, { label: 'قِنۡوَانٌ · Sourate 6, verset 99', text: '… طَلۡعِهَا قِ[[r:نۡوَ]]انٞ دَانِيَةٞ …' }] },
              { rule: 'Selon l’Imâm Ach-Châtibiyy, il y a deux (2) endroits n’ayant pas de fusion :',
                ex: [{ label: 'Sourate 36, versets 1-2', text: 'ي[[r:سٓ]] ۝ [[r:وَ]]ٱلۡقُرۡءَانِ ٱلۡحَكِيمِ' }, { label: 'Sourate 68, verset 1', text: '[[r:نٓ]]ۚ [[r:وَ]]ٱلۡقَلَمِ وَمَا يَسۡطُرُونَ' }] },
              { rule: 'Lorsqu’une voyelle double [At-tanwîn] est suivie d’un Hamzatou-l-wasl (هَمۡزَةُ ٱلۡوَصۡلِ), on fait intervenir la lettre Noûn de liaison (Noûn Qutn), accompagnée de la voyelle Al-Kasrah.',
                ex: [{ label: 'Sourate 2, verset 180', text: '… خَيۡ[[r:رًا]] ٱلۡوَصِيَّةُ ← خَيۡرَ[[r:نِ]] ٱلۡوَصِيَّةُ' }, { label: 'Sourate 75, verset 30', text: '… يَوۡمَئِ[[r:ذٍ]] ٱلۡمَسَاقُ ← يَوۡمَئِذِ[[r:نِ]] ٱلۡمَسَاقُ' }, { label: 'Sourate 22, verset 11', text: '… فِتۡنَ[[r:ةٌ]] ٱنقَلَبَ ← فِتۡنَتُ[[r:نِ]] ٱنقَلَبَ' }] }
            ] },
          { num: '3', title: 'La substitution (Al-Iqlâb)', ar: 'ٱلۡإِقۡلَابُ', verdict: '1 lettre : ب', chipBg: 'var(--amber-bg)', chipFg: 'var(--amber-fg)', def: '',
            cases: [
              { rule: 'On applique cette règle quand la lettre Noûn as-sâkinah ou At-tanwîn est suivi(e) par la lettre **Bâ (ب)** : le son « n » est substitué par le son « m », et on le prononce avec nasillement [Ghounnah].',
                ex: [{ label: TW(96, 15), text: 'لَنَسۡفَ[[r:عَۢا بِ]]ٱلنَّاصِيَةِ' }, { label: NS(104, 4), text: 'لَيُ[[r:نۢبَ]]ذَنَّ …' }],
                note: 'Remarques : dans certains exemplaires du Qur’ân, pour nous aider, il y a une petite lettre Mîm en miniature au-dessus du Noûn as-sâkinah ou du tanwîn lorsque l’on doit appliquer cette règle (exemple : لَئِنۢ بَسَطتَ). On ne joint pas totalement les lèvres : il ne faut pas comprimer les lèvres.' },
              { rule: 'Certaines sourates finissent par le signe d’Al-Iqlâb, à cause du Noûn as-sâkinah ou du tanwîn final : si le lecteur décide de faire la liaison, elle se fait avec la lettre Bâ (ب) de « Bismillâhi r-Rahmâni r-Rahîm » de la sourate suivante.',
                ex: [{ label: 'Sourates 54 et 55', text: 'عِندَ مَلِيكٖ مُّقۡتَدِ[[r:رِۭ بِ]]سۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ ٱلرَّحۡمَٰنُ' }] }
            ] },
          { num: '4', title: 'La dissimulation (Al-Ikhfâ)', ar: 'ٱلۡإِخۡفَاءُ', verdict: '15 lettres', chipBg: 'var(--surface3)', chipFg: 'var(--ink)',
            def: 'On applique cette règle quand la lettre Noûn as-sâkinah ou At-tanwîn est suivi(e) par l’une des quinze (15) lettres suivantes : [[L:ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك]]. On prononce alors la lettre Noûn sâkinah d’une manière qui se situe entre la clarification [Al-Idz’hâr] et l’assimilation [Al-Idghâm], sans appuyer sur la lettre [Ach-chaddah], mais avec nasillement [Ghounnah] (notes de cours : on traîne sur le Noûn pour aller vers la lettre qui suit).',
            cases: [
              { rule: 'Devant le Tâ (ت), le Thâ (ث) et le Djîm (ج) : dissimulation.', ex: [{ label: NS(90, 2), text: 'وَأَ[[r:نتَ]] …' }, { label: TW(66, 5), text: '… قَٰنِتَٰ[[r:تٖ تَٰٓ]]ئِبَٰتٍ …' }, { label: NS(101, 6), text: 'فَأَمَّا مَ[[r:ن ثَ]]قُلَتۡ …' }, { label: TW(70, 14), text: '… جَمِي[[r:عٗا ثُ]]مَّ …' }, { label: NS(49, 6), text: '… إِ[[r:ن جَ]]آءَكُمۡ …' }, { label: TW(70, 5), text: 'فَٱصۡبِرۡ صَبۡ[[r:رٗا جَ]]مِيلًا' }] },
              { rule: 'Devant le Dâl (د), le Dzâl (ذ) et le Zây (ز) : dissimulation.', ex: [{ label: NS(91, 10), text: 'وَقَدۡ خَابَ مَ[[r:ن دَ]]سَّىٰهَا' }, { label: TW(6, 132), text: 'وَلِكُ[[r:لّٖ دَ]]رَجَٰتٞ …' }, { label: NS(79, 43), text: 'فِيمَ أَنتَ مِ[[r:ن ذِ]]كۡرَىٰهَآ' }, { label: TW(111, 3), text: 'سَيَصۡلَىٰ نَا[[r:رٗا ذَ]]اتَ لَهَبٖ' }, { label: NS(91, 9), text: 'قَدۡ أَفۡلَحَ مَ[[r:ن زَ]]كَّىٰهَا' }, { label: TW(20, 102), text: '… يَوۡمَئِ[[r:ذٖ زُ]]رۡقٗا' }] },
              { rule: 'Devant le Sîn (س), le Chîn (ش) et le Ṣâd (ص) : dissimulation. Devant le Ṣâd, lettre emphatique, le nasillement est lourd.', ex: [{ label: NS(7, 46), text: '… أَ[[r:ن سَ]]لَٰمٌ عَلَيۡكُمۡ …' }, { label: TW(56, 26), text: 'إِلَّا قِيلٗا سَلَٰ[[r:مٗا سَ]]لَٰمٗا' }, { label: NS(113, 2), text: 'مِ[[r:ن شَ]]رِّ مَا خَلَقَ' }, { label: TW(80, 37), text: '… يَوۡمَئِ[[r:ذٖ شَ]]أۡنٞ …' }, { label: NS(107, 5), text: 'ٱلَّذِينَ هُمۡ عَ[[r:ن صَ]]لَاتِهِمۡ …' }, { label: TW(89, 22), text: '… صَ[[r:فّٗا صَ]]فّٗا' }],
                note: 'NB : pour faire Al-Idz’hâr, la langue touche le lieu de phonation (notes de cours : le point de sortie, Al-makhradj ٱلۡمَخۡرَجُ) de la lettre ن, c’est-à-dire le palais. Pour faire Al-Ikhfâ, la langue ne doit pas toucher le palais ; elle doit s’en approcher tout en allant vers le lieu de phonation de la lettre d’Al-Ikhfâ qui suit, dont le lieu de phonation et les attributs doivent être respectés. Le nasillement doit donc se faire avec emphase (nasillement lourd) lorsque le Noûn sâkinah est suivi de l’une des 5 lettres emphatiques d’Al-Ikhfâ : ص ض ط ظ ق.' },
              { rule: 'Devant le Ḍâd (ض), le Ṯô (ط) et le Ẕô (ظ) : dissimulation, avec un nasillement lourd (lettres emphatiques).', ex: [{ label: NS(68, 7), text: '… بِمَ[[r:ن ضَ]]لَّ …' }, { label: TW(9, 107), text: '… مَسۡجِ[[r:دٗا ضِ]]رَارٗا …' }, { label: NS(77, 29), text: 'ٱ[[r:نطَ]]لِقُوٓاْ …' }, { label: TW(8, 69), text: '… حَلَٰ[[r:لٗا طَ]]يِّبٗا …' }, { label: NS(83, 23), text: 'عَلَى ٱلۡأَرَآئِكِ يَ[[r:نظُ]]رُونَ' }, { label: TW(3, 117), text: '… قَوۡ[[r:مٖ ظَ]]لَمُوٓاْ …' }] },
              { rule: 'Devant le Fâ (ف), le Qôf (ق) et le Kâf (ك) : dissimulation. Devant le Qôf, lettre emphatique, le nasillement est lourd.', ex: [{ label: NS(70, 14), text: 'وَمَ[[r:ن فِ]]ي ٱلۡأَرۡضِ …' }, { label: TW(10, 70), text: 'مَتَٰ[[r:عٞ فِ]]ي ٱلدُّنۡيَا …' }, { label: NS(74, 51), text: 'فَرَّتۡ مِ[[r:ن قَ]]سۡوَرَةِۭ' }, { label: TW(29, 20), text: '… عَلَىٰ كُلِّ شَيۡ[[r:ءٖ قَ]]دِيرٞ' }, { label: NS(96, 11), text: 'أَرَءَيۡتَ إِ[[r:ن كَ]]انَ …' }, { label: TW(76, 17), text: '… كَأۡ[[r:سٗا كَ]]انَ …' }],
                note: 'Remarque : lorsqu’on applique cette règle, la langue ne doit pas toucher le palais lors du nasillement [Ghounnah]. La grande difficulté de cette règle réside dans le fait que la langue se déplace du point de sortie [Al-Makhradj] de la lettre Noûn pour aller vers le point de sortie de la lettre qui suit. Ceci doit être approfondi avec un professeur compétent.' }
            ] }
        ],
        notes: [
          { title: 'Remarque', text: 'Dans les situations de fusion et de dissimulation, la voyelle muette (As-soukoûn) n’est pas matérialisée sur la lettre Noûn, et les voyelles doubles (At-tanwîn) sont toujours décalées ; alors que dans la clarification, la voyelle muette est matérialisée sur la lettre Noûn, et les voyelles doubles sont parallèles.' },
          { title: 'Résumé', text: '1. La clarification (Al-Idz’hâr) devant ء ح خ ع غ ه : le Noûn et le tanwîn se lisent clairement.\n2. L’assimilation (Al-Idghâm) : avec nasillement devant م ن و ي, sans nasillement devant ل ر, où le Noûn disparaît totalement.\n3. La substitution (Al-Iqlâb) devant ب : le « n » devient « m », signalé par un Mîm en miniature.\n4. La dissimulation (Al-Ikhfâ) devant les 15 autres lettres : le nasillement se fait sans que la langue touche le palais.' }
        ] },
      a7: { num: '7', title: 'Le Mîm sâkinah', ar: 'ٱلۡمِيمُ ٱلسَّاكِنَةُ', desc: 'Les trois règles labiales : la fusion, la dissimulation et la clarification.', pages: 'pp. 38-41',
        intro: ['La lettre Mîm portant la voyelle muette (As-soukoûn) est appelée « **Mîm As-sâkinah** ». Selon la lettre qui va suivre, elle va subir trois (3) règles pour sa lecture : **la fusion**, **la dissimulation** et **la clarification**.', 'Pour marquer la différence avec les mêmes termes de la lettre Noûn as-sâkinah, on ajoute le mot **Ach-chafawiyy**, qui veut dire « labiale », car la lettre Mîm se prononce des lèvres.'],
        sections: [
          { num: '1', title: 'La fusion labiale (Al-Idghâm Ach-chafawiyy)', ar: 'ٱلۡإِدۡغَامُ ٱلشَّفَوِيُّ', verdict: '1 lettre : م', chipBg: 'var(--accent)', chipFg: 'var(--onaccent)', def: '',
            cases: [{ rule: '**Lorsque la lettre Mîm as-sâkinah est suivie d’une autre lettre Mîm (م)**, les deux lettres Mîm fusionnent pour n’en faire qu’une, que l’on prononce avec l’intensité [Ach-chaddah] et un nasillement [Al-Ghounnah] de deux temps. Les lèvres se joignent totalement.',
              ex: [{ label: 'Sourate 104, verset 8', text: 'إِنَّهَا عَلَيۡهِ[[r:م مُّ]]ؤۡصَدَةُۢ' }, { label: 'Sourate 106, verset 4', text: '… وَءَامَنَهُ[[r:م مِّ]]نۡ خَوۡفِۭ' }] }] },
          { num: '2', title: 'La dissimulation labiale (Al-Ikhfâ Ach-chafawiyy)', ar: 'ٱلۡإِخۡفَاءُ ٱلشَّفَوِيُّ', verdict: '1 lettre : ب', chipBg: 'var(--tint2)', chipFg: 'var(--accent)', def: '',
            cases: [{ rule: '**Lorsque la lettre Mîm as-sâkinah est suivie de la lettre Bâ (ب)**, la lettre Mîm est dissimulée : on la prononce d’une façon entre la clarification [Al-Idz’hâr] et l’assimilation [Al-Idghâm], en faisant attention à bien faire le nasillement [Al-Ghounnah]. Ici, on ne joint pas totalement les lèvres.',
              ex: [{ label: 'Sourate 105, verset 4', text: 'تَرۡمِيهِ[[r:م بِ]]حِجَارَةٖ …' }, { label: 'Sourate 96, verset 14', text: 'أَلَمۡ يَعۡلَ[[r:م بِ]]أَنَّ …' }] }] },
          { num: '3', title: 'La clarification labiale (Al-Idz’hâr Ach-chafawiyy)', ar: 'ٱلۡإِظۡهَارُ ٱلشَّفَوِيُّ', verdict: '26 lettres', chipBg: 'var(--amber-bg)', chipFg: 'var(--amber-fg)', def: '',
            cases: [{ rule: '**Lorsque la lettre Mîm as-sâkinah est suivie de toutes les autres lettres (notes de cours : 26 lettres)**, on prononce la lettre Mîm normalement et distinctement.',
              ex: [{ label: 'Sourate 109, verset 6', text: 'لَكُ[[r:مۡ دِ]]ينُكُمۡ …' }, { label: 'Sourate 112, verset 3', text: 'لَ[[r:مۡ يَ]]لِدۡ …' }, { label: 'Sourate 1, verset 7', text: '… عَلَيۡهِ[[r:مۡ وَ]]لَا ٱلضَّآلِّينَ' }, { label: 'Sourate 68, verset 38', text: 'إِنَّ لَكُ[[r:مۡ فِ]]يهِ …' }],
              note: 'La clarification sera plus forte lorsque la lettre Mîm as-sâkinah sera suivie des lettres Wâw (و) et Fâ (ف), car elles se prononcent toutes les deux des lèvres, tout comme la lettre Mîm. De peur d’avaler la prononciation du Mîm, on s’efforcera, dans ces cas-là, de la prononcer plus clairement.' }] }
        ],
        notes: [
          { title: 'Remarques', text: 'Pour la fusion et la dissimulation, la lettre Mîm ne porte pas de voyelle muette, tandis que pour la clarification, elle en est munie. Il faut souligner qu’Al-Iqlâb et Al-Ikhfâ Ach-chafawiyy se prononcent de la même manière.' },
          { title: 'Résumé', text: 'Après la lettre Mîm sans voyelle (Mîm as-sâkinah), on applique trois règles :\n• 1. la fusion labiale devant م, avec dédoublement et nasillement, les lèvres se joignant totalement ;\n• 2. la dissimulation labiale devant ب, avec nasillement, les lèvres ne se joignant pas totalement ;\n• 3. la clarification labiale devant les 26 autres lettres.\nLa substitution (Al-Iqlâb) est impossible ici, car elle remplace le Noûn par le Mîm, alors que la règle étudiée porte sur la lettre Mîm.' }

      if (rs) { const u = JSON.parse(rs) || {}; const ok = (o) => (o && typeof o === 'object' && !Array.isArray(o) ? o : {}); this.setState({ qLu: ok(u.lu), qAp: ok(u.ap), qGoal: [10, 20, 30, 50, 100].indexOf(u.goal) >= 0 ? u.goal : 20, qDay: typeof u.day === 'string' ? u.day : '', qSeen: ok(u.seen) }); }
    } catch (e) {}
    try { this._qSeenT = setInterval(() => this.qSeenTick(), 2000); } catch (e) {}
    try {
      const rq = window.localStorage.getItem('waqf-coran');
      if (rq) { const q = JSON.parse(rq); if (q && q.last && q.last.s) this._qLast = q.last; this.setState({ qTr: q.tr === true, qTj: q.tj === true, qClass: q.cl === true, qJuz: q.jz === true, qRec: this.qRecs().some((r) => r[0] === q.rec) ? q.rec : 6, qSpd: [0.5, 0.75, 1, 1.25].indexOf(q.spd) >= 0 ? q.spd : 1 }); }
    } catch (e) {}
    try {
      // Le Qur’ân : fine barre dorée en haut du lecteur, qui avance avec la lecture de la sourate
      let tp = false;
      const upd = () => {
        tp = false;
        const bar = document.getElementById('q-progress'); const list = document.getElementById('q-verses'); if (!bar || !list) return;
        const r = list.getBoundingClientRect(); const H = window.innerHeight;
        const span = r.height - H * 0.5; const done = H * 0.5 - r.top;
        const pc = span > 0 ? Math.max(0, Math.min(1, done / span)) : 1;
        bar.style.width = (pc * 100).toFixed(1) + '%';
      };
      this._qProgUpd = upd;
      window.addEventListener('scroll', () => { if (!tp) { tp = true; window.requestAnimationFrame(upd); } }, { passive: true });
      window.addEventListener('resize', () => { if (!tp) { tp = true; window.requestAnimationFrame(upd); } }, { passive: true });
      this._qProgT = setInterval(() => { if (this.S().screen === 'quranRead') upd(); }, 1000);
    } catch (e) {}
    try {
      // Le Qur’ân : mémorise le verset en haut de l’écran pour « Reprendre la lecture »
      let tq = null;
      window.addEventListener('scroll', () => {
        if (tq) return;
        tq = setTimeout(() => {
          tq = null;
          const s = this.S(); if (s.screen !== 'quranRead' || !s.qSurah) return;
          const items = document.querySelectorAll('#q-verses > li');
          for (let i = 0; i < items.length; i++) {
            if (items[i].getBoundingClientRect().bottom > 90) { if (!this._qLast || this._qLast.s !== s.qSurah || this._qLast.v !== i + 1) this.qSave(s.qSurah, i + 1); break; }
          }
        }, 400);
      }, { passive: true });
    } catch (e) {}
    try {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const f = () => this.setState({ sysDark: mq.matches });
      f();
      if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f);
    } catch (e) {}
    try {
      const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      const markInstalled = () => { try { window.localStorage.setItem('waqf-installe', '1'); } catch (e) {} this.setState({ installed: true }); };
      let flag = false;
      try { flag = window.localStorage.getItem('waqf-installe') === '1'; } catch (e) {}
      if (isStandalone()) markInstalled(); else if (flag) this.setState({ installed: true });
      window.addEventListener('appinstalled', markInstalled);
    } catch (e) {}
    try {
      if (window.caches && window.caches.keys) {
        window.caches.keys().then((keys) => {
          const found = keys.map((k) => /^niveau4c-v(\d+)-(\d{4}-\d{2}-\d{2})$/.exec(k)).filter(Boolean).map((m) => ({ n: parseInt(m[1], 10), d: m[2] }));
          if (found.length) { found.sort((a, b) => a.n - b.n); this.setState({ appVersion: found[0].d + '-' + found[0].n }); }
        }).catch(() => {});
      }
    } catch (e) {}
  }

  // ——— Suivi des progrès ———
  hash(t) {
    let h = 5381; const x = String(t);
    for (let i = 0; i < x.length; i++) h = ((h << 5) + h + x.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  qidOf(mode, it) {
    return mode + ':' + this.hash((it.p || it.s || it.t || it.w || '') + (it.k || ''));
  }

  qIndex() {
    if (this._qi) return this._qi;
    const D = this.D(); const idx = {};
    ['signes', 'types', 'ra', 'comp', 'comp4b', 'comp4a', 'idgham', 'madd'].concat(Object.keys(D.CHS)).forEach((tp) => ['qcm', 'vf', 'trous', 'ordre'].forEach((m) => (D[this.bankKey(m, tp)] || []).forEach((it) => {
      idx[this.qidOf(m, it)] = { mode: m, item: it, topic: tp };
    })));
    this._qi = idx;
    return idx;
  }

  topicStats(tp) {
    const idx = this.qIndex(); const pq = this.S().prog.q || {};
    let total = 0, seen = 0, ok = 0, ko = 0;
    Object.keys(idx).forEach((id) => {
      if (idx[id].topic !== tp) return;
      total++;
      const r = pq[id];
      if (r) { seen++; if (r.ok) ok++; else ko++; }
    });
    return { total, seen, ok, ko, pct: total ? Math.round(ok * 100 / total) : 0 };
  }

  recordAns(q, ok) {
    const s = this.S();
    const pq = Object.assign({}, s.prog.q);
    if (q && q.qid) {
      const r = pq[q.qid] || { n: 0, miss: 0 };
      pq[q.qid] = { n: r.n + 1, miss: r.miss + (ok ? 0 : 1), ok: !!ok };
    }
    return Object.assign({}, s.prog, { q: pq });
  }

  saveProg(p) {
    try { window.localStorage.setItem('waqf-progres', JSON.stringify(p)); } catch (e) {}
  }

  resetProgress() {
    const empty = { qcm: null, vf: null, trous: null, tqcm: null, tvf: null, ttrous: null };
    this.setState({ prog: { q: {}, hist: [] }, best: empty, confirmReset: false });
    this.saveProg({ q: {}, hist: [] });
    this.save(empty);
  }

  setLevel(l) {

  // ——— Recherche dans les fiches (français et arabe) ———
  // Texte lisible : marqueurs [[x:…]] et **…** retirés, isolations bidi supprimées.
  srClean(t) {
    return String(t == null ? '' : t)
      .replace(/\[\[W:[^\]]*\]\]/g, '')
      .replace(/\[\[[A-Za-z]:([^\]]*)\]\]/g, '$1')
      .replace(/\*\*/g, '')
      .replace(/[⁦-⁩‌-‏]/g, '')
      .replace(/\s+/g, ' ').trim();
  }

  // Forme de comparaison d’un caractère : sans accents ni voyelles arabes, en minuscules, alif et yâ unifiés.
  srNormChar(ch) {
    const c = ch.charCodeAt(0);
    if (c < 128) return ch === '-' ? ' ' : ch.toLowerCase();
    const x = ch.normalize('NFD').replace(/[̀-ͯؐ-ًؚ-ٰٟۖ-ۭ࣓-ࣿـ]/g, '').toLowerCase();
    return x.replace(/[ٱآأإٲٳ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
      .replace(/[’ʼ‘´]/g, "'").replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/[   ‑]/g, ' ');
  }

  // Texte normalisé ; avec withMap, la position d’origine de chaque caractère (pour surligner l’extrait).
  srNorm(t, withMap) {
    const s = String(t == null ? '' : t); let out = ''; const map = [];
    for (let i = 0; i < s.length; i++) {
      const n = this.srNormChar(s[i]);
      out += n;
      if (withMap) for (let k = 0; k < n.length; k++) map.push(i);
    }
    return withMap ? { out, map } : out;
  }

  srIndex() {
    if (this._si) return this._si;
    const D = this.D(); const out = [];
    const SKIP = { id: 1, chipBg: 1, chipFg: 1, tone: 1, signal: 1, group: 1, scale: 1, img: 1, go: 1, start: 1, verdictStyle: 1 };
    const texts = (o, acc) => {
      if (o == null) return acc;
      if (typeof o === 'string') {
        if (/^(var\(|#[0-9a-f]{3,8}$|s\d+v\d|data:|assets\/)/i.test(o) || /\.(webp|png|svg|jpe?g)$/i.test(o)) return acc;
        const c = this.srClean(o); if (c) acc.push(c); return acc;
      }
      if (Array.isArray(o)) { o.forEach((x) => texts(x, acc)); return acc; }
      if (typeof o === 'object') Object.keys(o).forEach((k) => { if (!SKIP[k]) texts(o[k], acc); });
      return acc;
    };
    const add = (lvl, where, title, go, obj) => {
      const segs = texts(obj, []); if (!segs.length) return;
      const t = this.srClean(title);
      out.push({ lvl, where, title: t, go, segs, norms: segs.map((x) => this.srNorm(x)), tnorm: this.srNorm(t) });
    };
    const chapter = (lvl, where, title, screen, prefix, obj, chap) => {
      (obj.sections || []).forEach((sec) => add(lvl, where, sec.title || title, { screen, chap, level: lvl, anchor: prefix + sec.num }, sec));
      const rest = Object.assign({}, obj); delete rest.sections;
      add(lvl, where, title, { screen, chap, level: lvl, anchor: '' }, rest);
    };
    Object.keys(D.CH4A).forEach((k) => chapter('4A', 'Niveau 4A, chapitre ' + D.CH4A[k].num, D.CH4A[k].title, 'learnCh', 'ch-', D.CH4A[k], k));
    D.COMP4A.forEach((h) => add('4A', 'Le Compagnon, niveau 4A', h.title, { screen: 'learnComp', level: '4A', anchor: 'comp-' + h.num }, h));
    chapter('4B', 'Niveau 4B, chapitre 8', 'Les différents types d’assimilations', 'learnId', 'id-', D.ID);
    chapter('4B', 'Niveau 4B, chapitre 10', 'Les prolongations', 'learnMd', 'md-', D.MD);
    D.COMP4B.forEach((h) => add('4B', 'Le Compagnon, niveau 4B', h.title, { screen: 'learnComp', level: '4B', anchor: 'comp-' + h.num }, h));
    chapter('4C', 'Niveau 4C, chapitre 9', 'Les règles de la lettre Ra', 'learnRa', 'ra-', D.RA);
    D.types.forEach((ty) => add('4C', 'Niveau 4C, chapitre 11', ty.name, { screen: 'learnTypes', level: '4C', anchor: '' }, ty));
    D.signs.forEach((sg) => add('4C', 'Niveau 4C, chapitre 15', sg.nom + ', ' + String(sg.designation).charAt(0).toLowerCase() + String(sg.designation).slice(1), { screen: 'learn', level: '4C', anchor: '' }, sg));
    Object.keys(D.CHS).filter((k) => !D.CH4A[k]).forEach((k) => chapter('4C', 'Niveau 4C, chapitre ' + D.CHS[k].num, D.CHS[k].title, 'learnCh', 'ch-', D.CHS[k], k));
    D.COMP.forEach((h) => add('4C', 'Le Compagnon, niveau 4C', h.title, { screen: 'learnComp', level: '4C', anchor: 'comp-' + h.num }, h));
    this.faqData().forEach((g) => g.items.forEach((it) => add('', 'Questions fréquentes', it.q, { screen: 'faq', anchor: it.id }, it)));
    this._si = out;
    return out;
  }

  // Forme « approchée » des translittérations (Qalqalah = Qolqolah, ghunna = Ghounnah, tajwid = tadjwîd) :
  // o, ou, u → a ; y → i ; dj, dz → j, z ; dh, zh → z ; h final après voyelle et lettres doublées ignorés.
  srLoose(o, map) {
    let out = ''; const m = [];
    const isL = (c) => c >= 'a' && c <= 'z';
    for (let i = 0; i < o.length; i++) {
      const at = i; let c = o[i]; const nx = o[i + 1] || '';
      if (c === "'") continue;
      if (c === 'o' && nx === 'u') { c = 'a'; i++; }
      else if (c === 'o' || c === 'u') c = 'a';
      else if (c === 'y') c = 'i';
      else if (c === 'd' && (nx === 'j' || nx === 'z')) continue;
      else if ((c === 'd' || c === 'z') && nx === 'h') { c = 'z'; i++; }
      const prev = out[out.length - 1] || '';
      if (c === 'h' && 'aei'.indexOf(prev) >= 0 && !isL(o[i + 1] || '')) continue;
      if (isL(c) && c === prev) continue;
      out += c; m.push(map ? map[at] : at);
    }
    return { out, map: m };
  }

  // Résultats : la phrase exacte passe en premier, sinon tous les mots doivent être présents.
  // Si rien n’est trouvé, une seconde passe tolère les variantes d’écriture des mots translittérés.
  srRun(q) {
    const nq = this.srNorm(this.srClean(q)).replace(/\s+/g, ' ').trim().replace(/(^|[^a-z'])(corans?|qurans?|qur an)(?![a-z])/g, "$1qur'an");
    if (this._src && this._src.nq === nq) return this._src;
    const lvl = this.S().level; const idx = nq.length >= 2 ? this.srIndex() : [];
    const pass = (key, tkey, qq) => {
      const terms = qq.split(' ').filter((x) => x.length > 0); const res = [];
      const esc = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const word = new RegExp('(^|[^0-9a-zÀ-ɏء-ي])' + esc(qq) + '($|[^0-9a-zÀ-ɏء-ي])');
      const short = qq.length <= 2;
      idx.forEach((e, i) => {
        const all = e[tkey] + ' \n ' + e[key].join(' \n ');
        const phrase = all.indexOf(qq) >= 0;
        if (!phrase && (short || !terms.every((t) => all.indexOf(t) >= 0))) return;
        const whole = phrase && word.test(all);
        if (short && !whole) return;
        res.push({ e, i, score: (phrase ? 10 : 0) + (whole ? 5 : 0) + (e[tkey].indexOf(qq) >= 0 ? 20 : 0) + (e.lvl === lvl ? 3 : 0) });
      });
      res.sort((a, b) => b.score - a.score || a.i - b.i);
      return { q: qq, terms, res };
    };
    let r = pass('norms', 'tnorm', nq); let loose = false;
    if (!r.res.length && /[a-z]/.test(nq)) {
      idx.forEach((e) => { if (!e.lnorms) { e.lnorms = e.norms.map((n) => this.srLoose(n).out); e.ltnorm = this.srLoose(e.tnorm).out; } });
      const lq = this.srLoose(nq).out.replace(/\s+/g, ' ').trim();
      if (lq.length >= 3) { const r2 = pass('lnorms', 'ltnorm', lq); if (r2.res.length) { r = r2; loose = true; } }
    }
    this._src = { nq, q: r.q, terms: r.terms, res: r.res, loose };
    return this._src;
  }

  // Extrait autour du passage trouvé, découpé en morceaux pour le surlignage,
  // avec le texte qui servira à retrouver ce passage dans la fiche.
  srSnippet(e, R) {
    const norms = R.loose ? e.lnorms : e.norms;
    const find = (t) => norms.findIndex((n, k) => n.indexOf(t) >= 0 && e.segs[k] !== e.title);
    let si = find(R.q); let nd = R.q;
    if (si < 0) for (const t of R.terms) { si = find(t); if (si >= 0) { nd = t; break; } }
    if (si < 0) {
      let k = e.segs.findIndex((x) => x !== e.title && x.length >= 30);
      if (k < 0) k = e.segs.findIndex((x) => x !== e.title);
      const r = k >= 0 ? e.segs[k] : '';
      return { needle: this.srNorm(e.title), ctx: '', parts: r ? [{ t: r.length > 150 ? r.slice(0, 150) + '…' : r, hl: false }] : [] };
    }
    const raw = e.segs[si]; let nm = this.srNorm(raw, true);
    if (R.loose) nm = this.srLoose(nm.out, nm.map);
    const p = nm.out.indexOf(nd);
    const a = nm.map[p]; let b = nm.map[p + nd.length - 1] + 1;
    while (b < raw.length && this.srNormChar(raw[b]) === '') b++;
    if (R.loose) while (b < raw.length && /[a-zÀ-ɏ]/i.test(raw[b])) b++;
    let from = Math.max(0, a - 70); let to = Math.min(raw.length, b + 90);
    if (from > 0) { const sp = raw.indexOf(' ', from); if (sp > -1 && sp < a) from = sp + 1; }
    if (to < raw.length) { const sp = raw.lastIndexOf(' ', to); if (sp > b) to = sp; }
    let cs = Math.max(0, a - 30); let ce = Math.min(raw.length, b + 30);
    if (cs > 0) { const sp = raw.indexOf(' ', cs); if (sp > -1 && sp < a) cs = sp + 1; }
    if (ce < raw.length) { const sp = raw.lastIndexOf(' ', ce); if (sp >= b) ce = sp; }
    const flat = (t) => this.srNorm(t).replace(/\s+/g, ' ').trim();
    return { needle: flat(raw.slice(a, b)), ctx: flat(raw.slice(cs, ce)), parts: [
      { t: (from > 0 ? '…' : '') + raw.slice(from, a), hl: false },
      { t: raw.slice(a, b), hl: true },
      { t: raw.slice(b, to) + (to < raw.length ? '…' : ''), hl: false }
    ] };
  }

  openSearch() {
    this.go('search');
    setTimeout(() => { try { const el = document.getElementById('search-q'); if (el) el.focus(); } catch (e) {} }, 120);
  }

  // Ouvre la fiche du résultat, puis fait défiler jusqu’au passage trouvé et le met en évidence.
  srOpen(e, needle, ctx) {
    const g = e.go; const s = this.S();
    if (g.level && g.level !== s.level) this.setLevel(g.level);
    if (g.chap) this.setState({ chap: g.chap });
    this.go(g.screen);
    setTimeout(() => this.srFocus(g.anchor, needle, ctx), 280);
  }

  srFocus(anchor, needle, ctx) {
    try {
      const root = (anchor && document.getElementById(anchor)) || document.querySelector('main');
      if (!root) return;
      if (root.tagName === 'DETAILS') root.open = true;
      let look = '';
      const has = (el) => this.srNorm(this.srClean(el.textContent)).replace(/\s+/g, ' ').indexOf(look) >= 0;
      [ctx, needle].some((x) => { look = x || ''; return look && has(root); });
      let target = null;
      if (look && has(root)) {
        target = root;
        for (let guard = 0; guard < 40; guard++) {
          const kid = Array.prototype.find.call(target.children, (c) => c.offsetParent !== null && has(c));
          if (!kid) break;
          target = kid;
        }
        while (target !== root && target.getBoundingClientRect().height < 28 && target.parentElement) target = target.parentElement;
      }
      const el = target || root;
      el.scrollIntoView({ behavior: 'smooth', block: target ? 'center' : 'start' });
      if (target && el.animate) el.animate([{ backgroundColor: 'rgba(242, 196, 107, 0.55)', boxShadow: '0 0 0 6px rgba(242, 196, 107, 0.55)' }, { backgroundColor: 'rgba(242, 196, 107, 0)', boxShadow: '0 0 0 6px rgba(242, 196, 107, 0)' }], { duration: 2600, easing: 'ease-out', delay: 350 });
    } catch (err) {}
  }

  // ——— Le Qur’ân : lecture hors ligne (texte Tanzil, traduction Hamidullah, couleurs du tajwîd) ———
  qLoadIndex() {
    if (this._qn || this._qnLoading) return;
    this._qnLoading = true;
    this.qGet('index').then((j) => { this._qn = j; this._qnLoading = false; this.forceUpdate(); })
      .catch(() => { this._qnLoading = false; this.setState({ qError: 'Impossible de charger la liste des sourates.' }); });
  }

  qSave(n, v) {
    const c = this._qn && this._qn.s[n - 1];
    this._qLast = { s: n, v: v || 1, name: c ? c.tr : (this._qLast && this._qLast.s === n ? this._qLast.name : '') };
    this.qStore();
  }

  // Préférences du Qur’ân (sans toucher à la dernière lecture).
  qStore() {
    const s = this.S();
    try { window.localStorage.setItem('waqf-coran', JSON.stringify({ last: this._qLast, tr: s.qTr === true, tj: s.qTj === true, cl: s.qClass === true, jz: s.qJuz === true, rec: s.qRec || 6, spd: s.qSpd || 1 })); } catch (e) {}
  }

  // Début de chacun des 30 juz : [sourate, verset] (découpage du mushaf de Médine).
  qJuzStarts() {
    return [[1, 1], [2, 142], [2, 253], [3, 93], [4, 24], [4, 148], [5, 82], [6, 111], [7, 88], [8, 41], [9, 93], [11, 6], [12, 53], [15, 1], [17, 1], [18, 75], [21, 1], [23, 1], [25, 21], [27, 56], [29, 46], [33, 31], [36, 28], [39, 32], [41, 47], [46, 1], [51, 31], [58, 1], [67, 1], [78, 1]];
  }

  // Sourates lues en classe, par niveau, dans l’ordre suivi en classe.
  qClassList(level) {
    return ({ '4A': [77, 76, 75, 74], '4B': [73, 72, 71], '4C': [70, 69, 68, 67] })[level] || [];
  }

  qOpen(n, v) {
    this._qBackY = null;
    if (!this._qs) this._qs = {};
    n = Math.max(1, Math.min(114, n | 0));
    if (this._aud && this.S().qSurah !== n) this.qStopAudio(true);
    this.qLoadIndex();
    // Un message d’écoute ou de micro concerne la sourate précédente : on l’efface en changeant de sourate.
    this.setState({ qSurah: n, qError: '', qAudioMsg: '', qBmEdit: '' });
    this.go('quranRead');
    const after = () => {
      if (v && v > 1) setTimeout(() => { try { const el = document.getElementById('v-' + v); if (el) el.scrollIntoView({ block: 'start' }); } catch (e) {} }, 80);
    };
    this.qSave(n, v || 1);
    this.qRecLoad(n);
    if (this._qs[n]) { after(); this.qPrefetch(); return; }
    this.setState({ qLoading: true });
    this.qGet(n).then((d) => { this._qs[n] = this.qNoBasmala(n, d); this.setState({ qLoading: false }); after(); this.qPrefetch(); })
      .catch(() => this.setState({ qLoading: false, qError: 'Impossible de charger cette sourate.' }));
  }

  // Découpe un verset selon les annotations de tajwîd ; chaque morceau reçoit la couleur de sa règle.
  qParts(t, ann) {
    const COL = { g: 'ghunna', ig: 'ghunna', f: 'ghunna', fs: 'ghunna', l: 'ghunna', is: 'ghunna', in: 'silent', ij: 'silent', iq: 'silent',
      h: 'silent', ls: 'silent', s: 'silent', q: 'qalqala', m2: 'madd2', m246: 'madd246', mf: 'madd246', mt: 'maddmt', m6: 'madd6' };
    // Les signes (voyelles, alif suscrit…) restent avec leur lettre : une couleur ne commence jamais au milieu d’une lettre.
    const isMark = (ch) => /[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E4\u06E7\u06E8\u06EA-\u06ED\u08D3-\u08FF]/.test(ch || '');
    const back = (x) => { while (x > 0 && x < t.length && isMark(t[x])) x--; return x; };
    const fwd = (x) => { while (x < t.length && isMark(t[x])) x++; return x; };
    ann = (ann || []).map((a) => [back(a[0]), fwd(a[1]), a[2]]).filter((a) => a[1] > a[0]);
    const cuts = [0, t.length]; ann.forEach((a) => { cuts.push(a[0], a[1]); });
    const pts = Array.from(new Set(cuts)).filter((x) => x >= 0 && x <= t.length).sort((a, b) => a - b);
    const parts = [];
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1]; if (b <= a) continue;
      let rule = '', code = ''; (ann || []).forEach((x) => { if (x[0] <= a && x[1] >= b) { rule = COL[x[2]] || ''; code = rule ? x[2] : ''; } });
      const last = parts[parts.length - 1];
      if (last && last.c === code) last.t += t.slice(a, b); else parts.push({ t: t.slice(a, b), k: rule, c: code });
    }
    // Lettres attachées d’un morceau à l’autre (même astuce que pour les lettres en couleur des fiches)
    const MARK = /[ً-ٰٟۖ-ࣰۭ-ࣿ‍]/;
    const DUAL = 'بتثجحخسشصضطظعغفقكلمنهيئىٮٯـ';
    const isAr = (ch) => /[ؠ-يٱ-ۓ]/.test(ch);
    for (let k = 0; k < parts.length - 1; k++) {
      const a = parts[k].t, b = parts[k + 1].t;
      let p = a.length - 1; while (p >= 0 && MARK.test(a[p])) p--;
      const lastBase = p >= 0 ? a[p] : '';
      if (lastBase && DUAL.indexOf(lastBase) >= 0 && b.length && isAr(b[0])) { parts[k].t = a + '‍'; parts[k + 1].t = '‍' + b; }
    }
    return parts.map((x) => ({ t: x.t, st: x.k ? 'color: var(--tj-' + x.k + ');' : '', r: x.c }));
  }

  // ——— Le Qur’ân : écoute des récitateurs (audio et minutage mot à mot de Quran.com, non mis en cache) ———
  qRecs() {
    // Récitateurs de Quran.com qui ont le minutage mot à mot (identifiants de l’API).
    return [[12, 'Al-Husary (muallim)'], [6, 'Al-Husary (murattal)'], [9, 'Al-Minshawi'], [2, 'Abdul Basit (murattal)'], [1, 'Abdul Basit (mujawwad)'], [1001, 'Ali Jaber'], [1002, 'Ali Al-Houdhayfi'], [1003, 'Abdullah Al-Matroud'], [3, 'As-Soudais'], [7, 'Mishary Al-Afasy'], [10, 'Ash-Shouraym']];
  }

  // Récitateurs d’EveryAyah (un fichier audio par verset), avec le minutage mot à mot de QuranLab (CC BY 4.0).
  qEA(rec) {
    return ({ 1001: ['ali-jaber', 'Ali_Jaber_64kbps'], 1002: ['ali-al-hudhaify', 'Hudhaify_128kbps'], 1003: ['abdullah-matroud', 'Abdullah_Matroud_128kbps'] })[rec] || null;
  }

  qAudioInfo(n, rec) {
    if (!this._qa) this._qa = {};
    const key = n + ':' + rec;
    if (this._qa[key]) return this._qa[key];
    const ea = this.qEA(rec);
    if (ea) {
      // Chaque verset : [durée, début mot 1, fin mot 1, début mot 2, fin mot 2, …] en millisecondes.
      const p3 = (x) => String(x).padStart(3, '0');
      this._qa[key] = this.qTim(ea[0], n).then((vs) => {
        const vt = {};
        vs.forEach((f, i) => { const seg = []; for (let k = 1; k + 1 < f.length; k += 2) seg.push([(k + 1) / 2, f[k], f[k + 1]]); vt[i + 1] = { from: 0, to: f[0], seg, url: 'https://everyayah.com/data/' + ea[1] + '/' + p3(n) + p3(i + 1) + '.mp3' }; });
        return { url: null, pv: true, vt, ready: true };
      }).then((info) => this.qOffBlobs(info)).catch((e) => { delete this._qa[key]; throw e; });
      return this._qa[key];
    }
    const url = 'https://api.qurancdn.com/api/qdc/audio/reciters/' + rec + '/audio_files?chapter=' + n + '&segments=true';
    this._qa[key] = this.qOffGet(url).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then((j) => {
      const f = j.audio_files && j.audio_files[0]; if (!f || !f.audio_url) throw new Error('audio absent');
      const vt = {};
      (f.verse_timings || []).forEach((t) => {
        const v = parseInt(String(t.verse_key).split(':')[1], 10);
        vt[v] = { from: t.timestamp_from, to: t.timestamp_to, seg: (t.segments || []).filter((sg) => sg.length >= 3).map((sg) => [sg[sg.length - 3], sg[sg.length - 2], sg[sg.length - 1]]) };
      });
      return { url: f.audio_url, vt, ready: true };
    }).then((info) => this.qOffBlobs(info)).catch((e) => { delete this._qa[key]; throw e; });
    return this._qa[key];
  }

  qAud() {
    if (this._aud) return this._aud;
    const a = new Audio(); a.preload = 'auto';
    this._aud = a; this.qApplySpd();
    a.addEventListener('playing', () => this.setState({ qAudio: 'playing', qAudioMsg: '' }));
    a.addEventListener('waiting', () => this.setState({ qAudio: 'loading' }));
    a.addEventListener('pause', () => { if (this.S().qAudio !== 'loading') this.setState({ qAudio: 'paused' }); });
    a.addEventListener('ended', () => { if (this._qCur && this._qCur.pv && this._qMode === 'surah' && this._qAdv !== this._qV) { this.qPvAdvance(); return; } this.qMark(0, 0); this.setState({ qAudio: 'paused' }); });
    a.addEventListener('error', () => { if (a.getAttribute('src')) this.setState({ qAudio: 'paused', qAudioMsg: 'L’écoute a échoué. Vérifie ta connexion internet.' }); });
    this._aud = a;
    return a;
  }

  // Allume le mot récité (et le verset en cours) directement dans la page.
  qMark(v, w) {
    try {
      if (this._qOnW) { this._qOnW.removeAttribute('data-on'); this._qOnW = null; }
      if (this._qOnV && (!v || this._qOnV.id !== 'v-' + v)) { this._qOnV.removeAttribute('data-cur'); this._qOnV = null; }
      if (v && !this._qOnV) { const li = document.getElementById('v-' + v); if (li) { li.setAttribute('data-cur', ''); this._qOnV = li; } }
      if (v && w) { const el = document.getElementById('w-' + v + '-' + w); if (el) { el.setAttribute('data-on', ''); this._qOnW = el; } }
    } catch (e) {}
  }

  // Fin d’écoute d’un verset : 0,3 s après le dernier mot, mais toujours avant le premier mot du verset suivant
  // (chez certains récitateurs, la fin du verset dans le minutage déborde sur le verset suivant).
  qVerseEnd(info, v) {
    const t = info.vt[v]; if (!t) return 0;
    let end = t.to - 40;
    if (t.seg.length) end = Math.min(end, t.seg[t.seg.length - 1][2] + 300);
    const nx = info.vt[v + 1];
    if (nx && !info.pv) end = Math.min(end, (nx.seg.length ? nx.seg[0][1] : nx.from) - 120);
    return Math.max(end, t.from + 300);
  }

  // Écoute de la sourate avec un fichier par verset : on enchaîne le verset suivant (ou on répète le verset).
  qPvAdvance() {
    const a = this._aud; const info = this._qCur; const v = this._qV; if (!a || !info || this._qAdv === v) return;
    if (this.S().qRepeat) { a.currentTime = 0; if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => {}); } return; }
    this._qAdv = v; const t = info.vt[v + 1];
    if (!t) { a.pause(); this.qMark(0, 0); return; }
    this._qV = v + 1; this._qW = -1; this._qSeekTo = 0;
    a.src = t.url; this.qApplySpd(); const p = a.play(); if (p && p.catch) p.catch(() => {});
    this.setState({ qPlayV: v + 1 }); this.qSave(this.S().qSurah, v + 1); this.qPvPre(v + 2);
    try { const li = document.getElementById('v-' + (v + 1)); if (li) { const r = li.getBoundingClientRect(); if (r.top < 70 || r.top > window.innerHeight - 260) li.scrollIntoView({ behavior: 'smooth', block: 'center' }); } } catch (e) {}
  }

  // Prépare le fichier du verset suivant pour éviter un blanc entre deux versets.
  qPvPre(v) {
    const info = this._qCur; const t = info && info.pv && info.vt[v]; if (!t) return;
    try { if (!this._qPre) { this._qPre = new Audio(); this._qPre.preload = 'auto'; this._qPre.muted = true; } if (this._qPre.getAttribute('src') !== t.url) this._qPre.src = t.url; } catch (e) {}
  }

  qTick() {
    const a = this._aud; const info = this._qCur; if (!a || !info) return;
    const ms = a.currentTime * 1000; const s = this.S();
    if (this._qSeekTo != null) { if (Math.abs(ms - this._qSeekTo) > 1500) return; this._qSeekTo = null; }
    let v = this._qV || 1;
    const t0 = info.vt[v];
    if (!info.pv && (!t0 || ms < t0.from - 50 || ms >= t0.to)) {
      // Verset en cours d’après le temps de lecture
      const keys = Object.keys(info.vt);
      for (let i = 0; i < keys.length; i++) { const t = info.vt[keys[i]]; if (ms >= t.from && ms < t.to) { v = +keys[i]; break; } }
    }
    const t = info.vt[this._qV];
    // Écoute d’un verset : on s’arrête juste après le dernier mot, sans entamer le verset suivant.
    const tEnd = t ? this.qVerseEnd(info, this._qV) : 0;
    if ((this._qMode === 'verse' || info.pv) && t && ms < tEnd && tEnd - ms < 260 && !this._qStopT && !a.paused) {
      // Le minuteur régulier passe toutes les 60 ms : pour couper net, on programme l’arrêt au moment exact.
      this._qStopT = setTimeout(() => { this._qStopT = null; this.qTick(); }, Math.max(0, (tEnd - ms) / (a.playbackRate || 1)));
    }
    if (this._qMode === 'verse' && t && ms >= tEnd - 15) {
      if (s.qRepeat && this._qThenMe == null) { a.currentTime = t.from / 1000; return; }
      a.pause(); this.qMark(this._qV, 0);
      if (this._qThenMe === this._qV) { const mv = this._qThenMe; this._qThenMe = null; (this._meReadyP || Promise.resolve()).then(() => this.qMeGo(mv)); }
      return;
    }
    if (this._qMode === 'surah' && info.pv && t && ms >= tEnd - 15) { this.qPvAdvance(); return; }
    if (this._qMode === 'surah' && s.qRepeat && t && v !== this._qV) { a.currentTime = t.from / 1000; return; }
    if (v !== this._qV) {
      this._qV = v; this.setState({ qPlayV: v }); this.qSave(s.qSurah, v);
      try { const li = document.getElementById('v-' + v); if (li) { const r = li.getBoundingClientRect(); if (r.top < 70 || r.top > window.innerHeight - 260) li.scrollIntoView({ behavior: 'smooth', block: 'center' }); } } catch (e) {}
    }
    const cur = info.vt[v]; let w = 0;
    if (cur) cur.seg.forEach((sg) => { if (ms >= sg[1] && ms < sg[2]) w = sg[0]; });
    if (w !== this._qW || v !== this._qMV) { this._qW = w; this._qMV = v; this.qMark(v, w); }
  }

  qPlay(v, mode) {
    const s = this.S(); const n = s.qSurah; const rec = s.qRec || 6; if (!n) return;
    this._qThenMe = null; this.qMeStop();
    const a = this.qAud();
    this._qMode = mode; this._qV = v; this._qW = -1; clearTimeout(this._qStopT); this._qStopT = null;
    this.setState({ qPlayerOn: true, qPlayV: v, qAudio: 'loading', qAudioMsg: '' });
    const start = (info) => {
      const t = info.vt[v]; if (!t) { this.setState({ qAudio: 'paused', qAudioMsg: 'Ce verset n’a pas de minutage chez ce récitateur.' }); return; }
      this._qCur = info;
      const src = info.pv ? t.url : info.url; if (a.getAttribute('src') !== src) a.src = src;
      this.qApplySpd();
      this._qAdv = 0; if (info.pv) this.qPvPre(v + 1);
      this._qSeekTo = t.from;
      const seek = () => { try { a.currentTime = t.from / 1000; } catch (e) {} };
      if (a.readyState >= 1) seek(); else a.addEventListener('loadedmetadata', seek, { once: true });
      const p = a.play();
      if (p && p.catch) p.catch((err) => {
        if (err && err.name === 'AbortError') return;
        this.setState({ qAudio: 'paused', qAudioMsg: err && err.name === 'NotAllowedError' ? 'Touche ▶ pour lancer l’écoute.' : 'L’écoute a échoué. Vérifie ta connexion internet.' });
      });
      clearInterval(this._qTimer); this._qTimer = setInterval(() => this.qTick(), 60);
    };
    const key = n + ':' + rec; const ready = this._qaReady && this._qaReady[key];
    if (ready) { start(ready); return; }
    // Sur iPhone, la lecture doit démarrer dans le geste : on « débloque » le lecteur tout de suite.
    try { if (!a.getAttribute('src')) { const u = a.play(); if (u && u.catch) u.catch(() => {}); } } catch (e) {}
    this.qAudioInfo(n, rec).then((info) => { if (!this._qaReady) this._qaReady = {}; this._qaReady[key] = info; if (this.S().qSurah === n && (this.S().qRec || 6) === rec) start(info); })
      .catch(() => this.setState({ qAudio: 'paused', qAudioMsg: navigator.onLine === false ? 'Écoute disponible avec une connexion internet. Sans internet, tu peux écouter les sourates lues en classe après les avoir téléchargées (Paramètres, carte « Écoute hors connexion »).' : 'Impossible de joindre Quran.com pour l’écoute. Réessaie dans un instant.' }));
  }

  // ——— Écoute hors connexion : l’audio des sourates lues en classe, gardé sur l’appareil (cache « waqf-audio ») ———
  qOffSz(rec, lvl) {
    // Taille de chaque pack en dixièmes de Mo, mesurée sur les serveurs audio (Quran.com et EveryAyah) le 25 novembre 2026.
    const T = { 1: [374, 268, 491], 2: [311, 253, 410], 3: [207, 172, 310], 6: [135, 103, 179], 7: [180, 136, 258], 9: [209, 155, 249], 10: [119, 93, 160], 12: [314, 236, 391], 1001: [78, 58, 102], 1002: [204, 149, 275], 1003: [198, 147, 223] };
    const i = ({ '4A': 0, '4B': 1, '4C': 2 })[lvl];
    return T[rec] && i != null ? T[rec][i] / 10 : 0;
  }

  qOffMo(mo) { return (Math.round(mo * 10) / 10).toFixed(1).replace('.', ','); }

  qOffMan() { try { return JSON.parse(window.localStorage.getItem('waqf-audio') || '{}') || {}; } catch (e) { return {}; } }

  qOffSaveMan(m) { try { window.localStorage.setItem('waqf-audio', JSON.stringify(m)); } catch (e) {} this.setState({ qOffMan: m }); }

  // Lit d’abord la copie gardée sur l’appareil, sinon passe par internet.
  qOffGet(url) {
    if (!('caches' in window)) return fetch(url);
    return caches.open('waqf-audio').then((c) => c.match(url)).then((r) => r || fetch(url), () => fetch(url));
  }

  // Si l’audio est sur l’appareil, le lecteur le lit depuis la mémoire (adresse « blob: ») : aucun réseau nécessaire.
  qOffBlobs(info) {
    if (!('caches' in window) || !info) return Promise.resolve(info);
    if (!this._qBlob) this._qBlob = {};
    const one = (u) => {
      if (!u || /^blob:/.test(u)) return Promise.resolve(u);
      if (this._qBlob[u]) return Promise.resolve(this._qBlob[u]);
      return caches.open('waqf-audio').then((c) => c.match(u)).then((r) => (r ? r.blob().then((b) => (this._qBlob[u] = URL.createObjectURL(b))) : u)).catch(() => u);
    };
    const jobs = [one(info.url).then((x) => { info.url = x; })];
    Object.keys(info.vt || {}).forEach((v) => { const t = info.vt[v]; if (t.url) jobs.push(one(t.url).then((x) => { t.url = x; })); });
    return Promise.all(jobs).then(() => info);
  }

  qOffForget(rec, list) {
    (list || []).forEach((n) => { const k = n + ':' + rec; if (this._qa) delete this._qa[k]; if (this._qaReady) delete this._qaReady[k]; });
  }

  qOffDl() {
    const s = this.S(); if (s.qOffBusy) return;
    if (!('caches' in window)) { this.setState({ qOffMsg: 'Ce navigateur ne permet pas de garder l’audio sur l’appareil.' }); return; }
    if (navigator.onLine === false) { this.setState({ qOffMsg: 'Il faut une connexion internet pour télécharger.' }); return; }
    const rec = s.qRec || 6, lvl = s.qOffLvl || s.level, list = this.qClassList(lvl) || [], ea = this.qEA(rec);
    const key = rec + ':' + lvl, est = (this.qOffSz(rec, lvl) || 10) * 1e6;
    const p3 = (x) => String(x).padStart(3, '0');
    this._qOffStop = false;
    this.setState({ qOffBusy: key, qOffPct: 0, qOffMsg: '' });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    let done = 0; const urls = [];
    const tick = () => this.setState({ qOffPct: Math.min(99, Math.round(done / est * 100)) });
    const get = (c, u) => {
      if (this._qOffStop) return Promise.reject(new Error('stop'));
      return c.match(u).then((hit) => {
        if (hit) { done += +hit.headers.get('content-length') || 0; urls.push(u); tick(); return; }
        return fetch(u).then((r) => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const len = +r.headers.get('content-length') || 0;
          return c.put(u, r).then(() => { done += len; urls.push(u); tick(); });
        });
      });
    };
    const run = async () => {
      const c = await caches.open('waqf-audio');
      for (const n of list) {
        if (ea) {
          const tu = 'assets/quran/t/' + ea[0] + '/s' + p3(n) + '.json';
          await get(c, tu);
          const nv = ((await (await c.match(tu)).json()).v || []).length;
          const vv = []; for (let v = 1; v <= nv; v++) vv.push('https://everyayah.com/data/' + ea[1] + '/' + p3(n) + p3(v) + '.mp3');
          while (vv.length) await Promise.all(vv.splice(0, 6).map((u) => get(c, u)));
        } else {
          const api = 'https://api.qurancdn.com/api/qdc/audio/reciters/' + rec + '/audio_files?chapter=' + n + '&segments=true';
          await get(c, api);
          const j = await (await c.match(api)).json();
          const f = j.audio_files && j.audio_files[0]; if (!f || !f.audio_url) throw new Error('audio absent');
          await get(c, f.audio_url);
        }
      }
    };
    run().then(() => {
      const m = this.qOffMan(); m[key] = { b: done, k: urls }; this.qOffSaveMan(m);
      this.qOffForget(rec, list);
      this.setState({ qOffBusy: '', qOffPct: 100 });
      this.flash('Audio téléchargé : ces sourates s’écoutent maintenant sans internet.');
    }).catch((e) => {

      const m = this.qOffMan();

      const keep = {}; Object.keys(m).forEach((k) => (m[k].k || []).forEach((u) => { keep[u] = 1; }));
      caches.open('waqf-audio').then((c) => Promise.all(urls.filter((u) => !keep[u]).map((u) => c.delete(u)))).catch(() => {});
      this.setState({ qOffBusy: '', qOffPct: 0, qOffMsg: stop ? 'Téléchargement arrêté.' : full ? 'Pas assez de place sur l’appareil pour cet audio.' : 'Le téléchargement a échoué. Vérifie ta connexion internet et réessaie.' });
    });
  }

  qOffDel(key) {
    const m = this.qOffMan(); const it = m[key]; if (!it) return;
    delete m[key];
    const keep = {}; Object.keys(m).forEach((k) => (m[k].k || []).forEach((u) => { keep[u] = 1; }));
    const p = key.split(':'); this.qOffForget(+p[0], this.qClassList(p[1]));
    if (this._qBlob) { (it.k || []).forEach((u) => { if (this._qBlob[u]) { try { URL.revokeObjectURL(this._qBlob[u]); } catch (e) {} delete this._qBlob[u]; } }); }
    if ('caches' in window) caches.open('waqf-audio').then((c) => Promise.all((it.k || []).filter((u) => !keep[u]).map((u) => c.delete(u)))).catch(() => {});
    this.qOffSaveMan(m); this.setState({ qOffMsg: '' });
    this.flash('Audio supprimé de l’appareil.');
  }

  qOffDelAll() {
    if ('caches' in window) caches.delete('waqf-audio').catch(() => {});
    if (this._qBlob) { Object.keys(this._qBlob).forEach((u) => { try { URL.revokeObjectURL(this._qBlob[u]); } catch (e) {} }); this._qBlob = {}; }
    this._qa = {}; this._qaReady = {};

    this.flash('Tous les audios téléchargés ont été supprimés.');
  }

  // Le navigateur peut effacer le cache en cas de manque de place : on vérifie que chaque pack est encore là.
  qOffCheck() {
    const m = this.qOffMan(); const keys = Object.keys(m);
    if (!keys.length || !('caches' in window)) { this.setState({ qOffMan: m }); return; }
    caches.open('waqf-audio').then((c) => Promise.all(keys.map((k) => { const u = (m[k].k || [])[(m[k].k || []).length - 1]; return u ? c.match(u).then((r) => { if (!r) delete m[k]; }) : (delete m[k], null); })))
      .then(() => this.qOffSaveMan(m)).catch(() => this.setState({ qOffMan: m }));
  }

  qOffVals(s) {
    const m = s.qOffMan || {}; const rec = s.qRec || 6; const lvl = s.qOffLvl || s.level; const key = rec + ':' + lvl;
    const list = this.qClassList(lvl) || []; const mo = this.qOffSz(rec, lvl);
    const busy = !!s.qOffBusy; const have = !!m[key];
    const tot = Object.keys(m).reduce((a, k) => a + (m[k].b || 0), 0) / 1e6;
    const nOther = Object.keys(m).filter((k) => k !== key).length;
    return {
      qOffIntro: 'Télécharge l’audio des sourates lues en classe, du niveau et du lecteur de ton choix, pour les écouter sans internet, avec les mots qui s’allument.',
      qOffLvlLine: 'Niveau ' + lvl + '\u00a0: sourates ' + list[0] + ' à ' + list[list.length - 1] + '.',
      qOffLvls: ['4A', '4B', '4C'].map((l) => ({ label: 'Niveau ' + l, pressed: l === lvl ? 'true' : 'false', off: busy, pick: () => { if (!this.S().qOffBusy) this.setState({ qOffLvl: l, qOffMsg: '' }); },
        style: 'min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14.5px; font-weight: 700; display: inline-flex; align-items: center; ' + (l === lvl ? 'background: var(--accent); color: var(--onaccent); border: 1.5px solid var(--accent);' : 'background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);') + (busy ? ' opacity: .55;' : '') })),
      qOffNot: !have && !busy, qOffHave: have && !busy, qOffBusy: busy,
      qOffSize: 'Taille : environ ' + this.qOffMo(mo) + ' Mo. Conseil : utilise le Wi-Fi.',
      qOffDlLabel: 'Télécharger (' + this.qOffMo(mo) + ' Mo)',
      qOffHaveLine: have ? 'Téléchargé sur cet appareil (' + this.qOffMo((m[key].b || 0) / 1e6) + ' Mo).' : '',
      qOffPctW: (s.qOffPct || 0) + '%', qOffPctN: String(s.qOffPct || 0), qOffBusyLabel: 'Téléchargement… ' + (s.qOffPct || 0) + ' %',
      qOffTotShow: nOther > 0 && !busy, qOffTotLine: 'Total des audios gardés sur cet appareil : ' + this.qOffMo(tot) + ' Mo.',
      qOffMsgShow: !!s.qOffMsg, qOffMsg: s.qOffMsg || '',
      qOffGo: () => this.qOffDl(), qOffStop: () => { this._qOffStop = true; }, qOffDelCur: () => this.qOffDel(key), qOffDelAll: () => this.qOffDelAll()

  qPrefetch() {
    const s = this.S(); const n = s.qSurah; const rec = s.qRec || 6;
    if (!n) return;
    const key = n + ':' + rec;
    this.qAudioInfo(n, rec).then((info) => { if (!this._qaReady) this._qaReady = {}; this._qaReady[key] = info; }).catch(() => {});
  }

  qToggle() {

  }

  qStep(d) {
    const s = this.S(); const nv = this._qn && this._qn.s[s.qSurah - 1] ? this._qn.s[s.qSurah - 1].nv : 999;
